  /* ---------- 脚注：编号 + 原文 ⇄ 解释 双向跳转 ---------- */
  function bindFootnotes() {
    var lis = Array.prototype.slice.call(mdBody.querySelectorAll('.footnotes ol li'));
    var refs = Array.prototype.slice.call(mdBody.querySelectorAll('.footnote-ref'));

    /* 幂等：postRender 可能对同一份 DOM 执行多次，先清掉上一轮生成的返回链接 */
    Array.prototype.slice.call(mdBody.querySelectorAll('.footnote-back')).forEach(function (el) {
      if (el.parentNode) el.parentNode.removeChild(el);
    });

    /* 1) 引用点：填充序号 + 唯一锚点 id（同一脚注被多次引用 → fnref-id / fnref-id-2 / …） */
    var seen = {}, byFn = {};
    refs.forEach(function (sup) {
      var id = sup.getAttribute('data-fn') || '';
      var idx = -1;
      for (var k = 0; k < lis.length; k++) {
        if (lis[k].id === 'fn-' + id) { idx = k; break; }
      }
      seen[id] = (seen[id] || 0) + 1;
      sup.id = 'fnref-' + id + (seen[id] > 1 ? '-' + seen[id] : '');
      var a = sup.querySelector('a');
      if (a) {
        a.setAttribute('href', '#fn-' + id);
        if (idx >= 0) {
          a.textContent = idx + 1;
          a.setAttribute('title', '跳转到脚注 ' + (idx + 1));
        }
      }
      (byFn[id] = byFn[id] || []).push(sup);
    });

    /* 2) 解释项：追加「返回原文」链接（原文引用几次就排几个 ↩，与 GitHub 一致） */
    lis.forEach(function (li) {
      var id = li.id.indexOf('fn-') === 0 ? li.id.slice(3) : '';
      var group = byFn[id] || [];
      group.forEach(function (sup) {
        var back = document.createElement('a');
        back.className = 'footnote-back';
        back.setAttribute('href', '#' + sup.id);
        back.setAttribute('title', '返回原文引用处');
        back.setAttribute('aria-label', '返回原文引用处');
        back.textContent = '↩';
        li.appendChild(back);
      });
    });
  }

  /* 脚注 / 标题锚点跳转：原生 # 跳转在 hash 未变化时不会再次滚动，这里统一接管、定位并闪一下高亮 */
  var fnFlashTimer = null;
  function flashFootnote(target) {
    var el = target;
    if (el.tagName !== 'LI') el = (el.closest && el.closest('.footnote-ref')) || el;
    Array.prototype.slice.call(mdBody.querySelectorAll('.fn-flash')).forEach(function (n) { n.classList.remove('fn-flash'); });
    el.classList.add('fn-flash');
    if (fnFlashTimer) clearTimeout(fnFlashTimer);
    fnFlashTimer = setTimeout(function () { el.classList.remove('fn-flash'); }, 2600);
  }

  /* 锚点归一化：去掉标点/空格/连字符、全角转半角、统一小写。
   * 这样 GitHub 的 21-启动--停止--重启--查看状态（斜杠两侧各留一个空格 → 两个连字符）
   * 与本程序生成的 21-启动-停止-重启-查看状态 能互相命中，直接粘标题原文也行 */
  function normAnchor(s) {
    var t = String(s || '');
    try { t = t.normalize('NFKC'); } catch (e) {}
    return t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
  }
  function lookupAnchor(id) {
    if (!id) return null;
    var el = document.getElementById(id);
    if (el && mdBody.contains(el)) return el;
    /* 界面元素可能占用了同名 id（如 reader）；正文里另有同 id 时以正文为准 */
    if (/^[^{}\[\]"\\]+$/.test(id)) {
      var exact = mdBody.querySelector('[id="' + id + '"]');
      if (exact) return exact;
    }
    var want = normAnchor(id);
    if (!want) return null;
    var i, nodes = mdBody.querySelectorAll('[id]');
    for (i = 0; i < nodes.length; i++) if (normAnchor(nodes[i].id) === want) return nodes[i];
    var hs = mdBody.querySelectorAll('h1, h2, h3, h4, h5, h6');
    for (i = 0; i < hs.length; i++) if (normAnchor(hs[i].textContent) === want) return hs[i];
    return null;
  }

  /* 跳转落点：目标放在视口 20% 高度处（上方留一点上下文，标题下面的内容尽量多露出来） */
  var ANCHOR_TOP_RATIO = 0.2;
  var anchorSettle = null;
  function cancelAnchorSettle() {
    if (anchorSettle) { clearTimeout(anchorSettle.timer); anchorSettle = null; }
  }
  /* 用户一旦自己滚了（滚轮 / 触摸 / 拖滚动条 / 按键）就放弃补正，别把人拽回去 */
  ['wheel', 'touchstart', 'mousedown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, cancelAnchorSettle, { passive: true });
  });

  function scrollToAnchor(target) {
    var box = null, n = target.parentNode;
    while (n && n.nodeType === 1 && n !== document.body && n !== document.documentElement) {
      var cs = getComputedStyle(n);
      if (/(auto|scroll|overlay)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight + 1) { box = n; break; }
      n = n.parentNode;
    }
    var viewH = box ? box.clientHeight : window.innerHeight;
    var want = Math.max(64, Math.round(viewH * ANCHOR_TOP_RATIO)); /* 视口很矮时别贴到顶栏下面 */
    var offsetOf = function () {
      return target.getBoundingClientRect().top - (box ? box.getBoundingClientRect().top : 0);
    };
    var place = function (behavior) {
      var top = (box ? box.scrollTop : window.scrollY) + offsetOf() - want;
      top = Math.max(0, top);
      if (box) box.scrollTo({ top: top, behavior: behavior });
      else window.scrollTo({ top: top, behavior: behavior });
    };

    cancelAnchorSettle();
    place('smooth');
    /* 惰性图片 / 图表会在滚动途中撑开版面，把落点顶偏 → 之后一小段时间内补正几次，直到位置稳定 */
    var state = { timer: 0, left: 5 };
    anchorSettle = state;
    var tick = function () {
      if (anchorSettle !== state) return;
      if (!document.documentElement.contains(target)) { anchorSettle = null; return; }
      var before = box ? box.scrollTop : window.scrollY;
      if (Math.abs(offsetOf() - want) > 8) place('auto');
      var after = box ? box.scrollTop : window.scrollY;
      if (Math.abs(after - before) < 2) { anchorSettle = null; return; } /* 已滚到底，补正也没用 */
      if (state.left-- > 0) state.timer = setTimeout(tick, 260);
      else anchorSettle = null;
    };
    state.timer = setTimeout(tick, 280);
  }

  function bindFootnoteJump() {
    if (mdBody.dataset.fnJumpBound) return;
    mdBody.dataset.fnJumpBound = '1';
    mdBody.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a || !mdBody.contains(a)) return;
      var id = (a.getAttribute('href') || '').slice(1);
      if (!id) return;
      try { id = decodeURIComponent(id); } catch (err) {}
      var target = lookupAnchor(id);
      if (!target) return; /* 正文内无此锚点 → 交回浏览器默认行为 */
      e.preventDefault();
      scrollToAnchor(target);
      flashFootnote(target);
    });
  }

  /* 隐藏内容 ||spoiler||：点击（或键盘 Enter/空格）显示；显示后再点则按里面的链接走 */
  function bindSpoilers() {
    if (mdBody.dataset.spoilerBound) return;
    mdBody.dataset.spoilerBound = '1';
    var targetOf = function (e) { return e.target && e.target.closest ? e.target.closest('.spoiler') : null; };
    mdBody.addEventListener('click', function (e) {
      var sp = targetOf(e);
      if (!sp || sp.classList.contains('revealed')) return;
      e.preventDefault();
      e.stopPropagation();
      sp.classList.add('revealed');
    });
    mdBody.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      var sp = targetOf(e);
      if (!sp) return;
      e.preventDefault();
      sp.classList.add('revealed');
    });
  }

  /* ---------- 代码块显示模式：普通模式 / 代码模式 ----------
   * 普通模式：不软换行、不做续行缩进（保持原样，长行横向滚动）——ASCII 流程图 / 管线图这类
   *           「排版即内容」的块用它；不带语言名或语言名为 text 的块默认走这里。
   * 代码模式：软换行 + 续行跟该行行首缩进（等价 Monaco wrappingIndent:'same'）——带语言名的块默认。
   * 用户手动切换的结果按块序号记在文件对象上（f.codeModes），重渲染（编辑区改动、切主题）后仍在。 */
  function codeModeDefault(lang) { return (!lang || lang === 'text') ? 'plain' : 'code'; }
  function codeModeLabel(mode) { return mode === 'plain' ? '普通模式' : '代码模式'; }
  function codeModeTitle(mode) {
    return mode === 'plain'
      ? '当前为 普通模式：无自动软换行和自动缩进，保持代码原本的整体结构 · 点击切换为 代码模式'
      : '当前为 代码模式：超出代码块时自动进行软换行，续行与行首缩进对齐 · 点击切换为 普通模式';
  }
  function codeModeButton(mode) {
    return '<button type="button" class="code-mode" title="' + attrEsc(codeModeTitle(mode)) + '" ' +
           'aria-label="' + attrEsc(codeModeTitle(mode)) + '">' + codeModeLabel(mode) + '</button>';
  }
  function applyCodeMode(block, mode) {
    block.setAttribute('data-mode', mode);
    var btn = block.querySelector('.code-mode');
    if (btn) {
      btn.textContent = codeModeLabel(mode);
      btn.title = codeModeTitle(mode);
      btn.setAttribute('aria-label', btn.title);
    }
  }
  function toggleCodeMode(block) {
    if (!block) return;
    var next = block.getAttribute('data-mode') === 'plain' ? 'code' : 'plain';
    applyCodeMode(block, next);
    var f = currentFile();
    if (f) {
      var idx = Array.prototype.indexOf.call(mdBody.querySelectorAll('.code-block'), block);
      if (idx >= 0) { if (!f.codeModes) f.codeModes = {}; f.codeModes[idx] = next; }
    }
  }
  function applyCodeModes() {
    var f = currentFile();
    var modes = (f && f.codeModes) || null;
    if (!modes) return;
    Array.prototype.forEach.call(mdBody.querySelectorAll('.code-block'), function (block, i) {
      if (modes[i]) applyCodeMode(block, modes[i]);
    });
  }

  /* 代码块顶栏按钮：复制 / 下载（事件委托，重渲染后依然有效） */
  function bindCodeActions() {
    if (mdBody.dataset.codeActBound) return;
    mdBody.dataset.codeActBound = '1';
    var closeAll = function (except) {
      mdBody.querySelectorAll('.code-tools.open').forEach(function (t) { if (t !== except) t.classList.remove('open'); });
    };
    mdBody.addEventListener('click', function (e) {
      /* 点「普通模式 / 代码模式」按钮：只切换显示模式，不碰复制下载面板 */
      var modeBtn = e.target && e.target.closest ? e.target.closest('.code-mode') : null;
      if (modeBtn && mdBody.contains(modeBtn)) {
        toggleCodeMode(modeBtn.closest('.code-block'));
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      /* 点语言角标：切换按钮面板（触屏没有 hover，靠这一下） */
      var lang = e.target && e.target.closest ? e.target.closest('.code-lang') : null;
      if (lang && mdBody.contains(lang)) {
        var tools = lang.closest('.code-tools');
        var on = tools.classList.contains('open');
        closeAll(tools);
        tools.classList.toggle('open', !on);
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      var btn = e.target && e.target.closest ? e.target.closest('.code-act') : null;
      if (!btn || !mdBody.contains(btn)) { closeAll(null); return; }
      closeAll(btn.closest('.code-tools')); /* 只收起其它块的面板，本块保持展开（方便接着点另一个按钮） */
      var block = btn.closest ? btn.closest('.code-block') : null;
      var codeEl = block ? block.querySelector('pre code') : null;
      if (!codeEl) return;
      e.preventDefault();
      e.stopPropagation();
      var text = codeEl.textContent;
      if (btn.getAttribute('data-act') === 'copy') {
        var ok = function () {
          var old = btn.innerHTML;
          btn.classList.add('done');
          btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>已复制';
          setTimeout(function () { btn.classList.remove('done'); btn.innerHTML = old; }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
        } else { fallbackCopy(text); ok(); }
      } else {
        var blockLang = (block.getAttribute('data-lang') || 'txt');
        var ext = { js: 'js', jsx: 'jsx', ts: 'ts', json: 'json', css: 'css', html: 'html', xml: 'xml',
                    python: 'py', py: 'py', bash: 'sh', sh: 'sh', shell: 'sh', sql: 'sql', java: 'java',
                    c: 'c', cpp: 'cpp', go: 'go', rust: 'rs', yaml: 'yml', toml: 'toml', ini: 'ini',
                    markdown: 'md', diff: 'diff' }[blockLang] || 'txt';
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'snippet.' + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast('已下载代码片段：snippet.' + ext);
      }
    });
  }

  /* 渲染后处理。返回一个 promise：MathJax 排版 + mermaid 绘制都算「重活」，
   * 主题切换时要在 View Transition 的回调里等它们干完，否则截到的「切换后」还是旧配色的图。 */
  function postRender() {
    /* 脚注：编号 + 双向跳转锚点 */
    bindFootnotes();
    bindFootnoteJump();
    bindSpoilers();
    bindCodeActions();
    applyCodeModes(); /* 恢复本文件里手动切换过的代码块显示模式 */
    var jobs = [];
    /* MathJax：渲染数学公式（库加载后或稍后 load 事件都会触发） */
    if (window.MathJax && MathJax.typesetPromise) {
      jobs.push(MathJax.typesetPromise([mdBody]).catch(function () {}));
    }
    /* Mermaid：渲染图表（只处理尚未渲染的；无库时回退为代码块样式） */
    var els = Array.prototype.slice.call(mdBody.querySelectorAll('.mermaid')).filter(function (el) {
      return !el.querySelector('svg');
    });
    if (els.length) {
      if (window.mermaid) {
        try {
          mermaid.initialize({ startOnLoad: false, theme: (html.dataset.theme === 'light' ? 'default' : 'dark') });
          jobs.push(mermaid.run({ nodes: els }).then(function () {
            /* 只有真出了 svg 才算渲染成功（mermaid 遇到 data-processed 会静默跳过） */
            els.forEach(function (el) { if (el.querySelector('svg')) el.dataset.rendered = html.dataset.theme; });
            bindMermaidZoom(); /* svg 渲染完成后再绑定点击放大 */
          }).catch(function () {
            els.forEach(fallbackMermaid);
          }));
        } catch (e) {
          els.forEach(fallbackMermaid);
        }
      } else {
        els.forEach(fallbackMermaid);
      }
    }
    bindMermaidZoom(); /* 已渲染图表绑定点击放大（含 load 后补渲染的） */
    return Promise.all(jobs);
  }

  function copyHtml() {
    var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>' +
      esc(docName.textContent) + '</title></head><body>' +
      mdBody.outerHTML + '</body></html>';
    var done = function () { showToast('已复制渲染后的 HTML'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(done, function () { fallbackCopy(html); done(); });
    } else { fallbackCopy(html); done(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- 主题 / 字体 ---------- */
  var ICONS = {
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24"><path d="M20.2 13.6A8.2 8.2 0 0 1 10.4 3.8a8.2 8.2 0 1 0 9.8 9.8z"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>',
    trashWarn: '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/><path d="M12 1.5v2"/></svg>'
  };
  var btnTheme = $('#btnTheme');
  var themeAnimTimer = null;
  var themeWanted = null; /* 最近一次「想要」的主题：连点时以它为准，不要读还没落地的 DOM 状态
                           （View Transition 的 DOM 改动在回调里执行，会有几十到几百毫秒的时间差） */
  function nextTheme() { return (themeWanted || html.dataset.theme) === 'dark' ? 'light' : 'dark'; }

  /* ---- 主题切换时 mermaid 按需重绘 ----
   * 一张图重绘约 10ms，图一多就致命：实测 36 张图全量重绘要 358ms，主线程被卡住这么久，
   * 主题过渡就被整个吞掉了（看起来是「先卡一下再整体变色」）。所以只重绘视口附近的图，
   * 其余的挂进待办，滚到附近再补——它们的尺寸不变，不会引起版面跳动。 */
  var pendingMermaid = [];
  var pendingFlushRaf = 0;

  /* margin：判定「算在视口附近」的额外余量。切换主题时只补屏幕上真正看得见的那几张（余量小，
   * 免得白算十几张图把过渡推迟）；滚动补绘时余量大，等它滚到眼前时早就换好色了。 */
  function nearViewport(el, margin) {
    var r = el.getBoundingClientRect();
    var h = window.innerHeight || 800;
    var m = margin == null ? 300 : margin;
    return r.bottom > -m && r.top < h + m;
  }
  function rerenderMermaid(nodes) {
    nodes.forEach(function (el) {
      el.textContent = el.dataset.src;
      el.removeAttribute('data-processed'); /* mermaid 靠这个属性跳过「已渲染」的节点，不清掉就不会重绘 */
      delete el.dataset.rendered;
    });
    return postRender();
  }
  function flushPendingMermaid() {
    pendingFlushRaf = 0;
    if (!pendingMermaid.length) return;
    var hit = [], keep = [];
    pendingMermaid.forEach(function (el) {
      if (!el.isConnected || el.dataset.rendered === html.dataset.theme) return; /* 节点已作废 / 已经补上 */
      (nearViewport(el, 800) ? hit : keep).push(el);
    });
    pendingMermaid = keep;
    if (hit.length) rerenderMermaid(hit).then(function () { schedulePendingFlush(); });
  }
  function schedulePendingFlush() {
    if (pendingFlushRaf || !pendingMermaid.length) return;
    pendingFlushRaf = requestAnimationFrame(flushPendingMermaid);
  }
  function queuePendingMermaid(nodes) {
    if (!nodes.length) return;
    pendingMermaid = pendingMermaid.concat(nodes);
    if (queuePendingMermaid.bound) return;
    queuePendingMermaid.bound = 1;
    ['scroll', 'resize'].forEach(function (ev) { window.addEventListener(ev, schedulePendingFlush, { passive: true }); });
    if (reader) reader.addEventListener('scroll', schedulePendingFlush, { passive: true });
    /* 兜底：用户一直不滚动的话，隔一会儿也把剩下的补上（仍然只补视口附近的） */
    setInterval(schedulePendingFlush, 1500);
  }

  /* 亮暗主题切换后重绘 mermaid（mermaid 的主题色在渲染时就写进 SVG 了，不重绘会一直是旧配色）。
   * 返回 promise：等「视口附近」那批重绘完成，供 View Transition 截「切换后」那一帧。 */
  function refreshMermaid() {
    if (!window.mermaid || !mdBody) return Promise.resolve();
    var stale = Array.prototype.slice.call(mdBody.querySelectorAll('.mermaid[data-src]')).filter(function (el) {
      return el.dataset.rendered && el.dataset.rendered !== html.dataset.theme && el.querySelector('svg');
    });
    if (!stale.length) { flushPendingMermaid(); return Promise.resolve(); }
    var near = [], far = [];
    stale.forEach(function (el) { (nearViewport(el, 300) ? near : far).push(el); });
    closeZoom(); /* 放大浮层里是旧图，直接关掉 */
    var p = rerenderMermaid(near);
    queuePendingMermaid(far);
    return p;
  }

  /* 切主题的「重活」都在这里：改根属性 + 按钮文案 + Monaco 重配主题 + 重绘 mermaid。
   * 返回 promise，供 View Transition 等它干完再截「切换后」那一帧。 */
  function applyThemeSwitch(t) {
    html.dataset.theme = t;
    try { localStorage.setItem('md-theme', t); } catch (e) {}
    btnTheme.querySelector('.mi-icon').innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
    btnTheme.querySelector('.mi-text').textContent = t === 'dark' ? '切换到亮色主题' : '切换到暗色主题';
    btnTheme.title = btnTheme.querySelector('.mi-text').textContent;
    if (typeof applyMdTheme === 'function') applyMdTheme();
    if (typeof refreshMermaid === 'function') return refreshMermaid();
  }

  /* animate=false 用于首屏：避免刚打开就先演一遍过渡 */
  function setTheme(t, animate) {
    themeWanted = t;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (animate === false || reduce || !document.startViewTransition) {
      /* 老路子：给 <html> 挂 .theme-anim，让元素各自过渡（兼容性广，但逐元素过渡在长文档上会掉帧） */
      if (animate !== false && !reduce) {
        html.classList.add('theme-anim');
        void html.offsetWidth; /* 先让过渡规则落到样式上，紧接着改主题才会真的「过渡」而不是瞬切 */
        if (themeAnimTimer) clearTimeout(themeAnimTimer);
        themeAnimTimer = setTimeout(function () { html.classList.remove('theme-anim'); }, 420);
      }
      applyThemeSwitch(t);
      return;
    }
    /* 首选：View Transition。浏览器把「切换前」整屏截一张图 → 在回调里干完所有重活
     * （重绘 mermaid、给 Monaco 换主题、超长文档重排重绘）→ 再对「切换后」整屏做一次
     * 合成层淡入淡出。好处：① 不再给每个 DOM 节点挂 transition，文档多大、代码块多少都不卡；
     * ② 重活不会把过渡「吞掉」——以前 mermaid 重绘要卡住主线程 400ms，340ms 的过渡直接演完/丢帧，
     * 看起来就是「先卡一下再整体变色」。 */
    try {
      var vt = document.startViewTransition(function () { return applyThemeSwitch(t); });
      if (vt && vt.finished && vt.finished.catch) vt.finished.catch(function () {});
    } catch (err) {
      applyThemeSwitch(t);
    }
  }
  setTheme(html.dataset.theme || 'dark', false);

  var btnFont = $('#btnFont');
  function setFont(f) {
    html.dataset.font = f;
    try { localStorage.setItem('md-font', f); } catch (e) {}
    btnFont.querySelector('.mi-text').textContent = f === 'serif' ? '正文字体：衬线' : '正文字体：黑体';
    btnFont.title = f === 'serif' ? '当前：衬线字体，点击切换为黑体' : '当前：黑体，点击切换为衬线字体';
  }
  setFont(html.dataset.font || 'serif');

  /* ---------- 二级菜单与手机「返回键」 ----------
   * 手机端（安卓 Chrome）按返回键默认直接退出页面。这里让每个打开的二级菜单
   * （更多菜单 / 文件库 / 图表放大浮层）占用一条历史记录：返回键触发的 popstate
   * 先关掉最上面那一层，并且只要还有层开着就再压一条守卫，只有在没有任何层时才真的离开页面。
   * 用按钮、ESC、点遮罩关掉时，把占用的那条历史记录一起回退，保证历史干净
   * ——不会出现「关掉菜单后按返回还要空按一次」。 */
  var mdLayers = [];     /* 已打开的层，元素是「关掉这一层」的函数，后进先出 */
  var mdLayerBack = 0;   /* 程序化 history.back() 的计数：分辨 popstate 是不是自己触发的 */

  /* 关闭用的是 history.back()，而浏览器在历史回退时默认会「恢复那条记录里的滚动位置」：
   * 打开文件库时记录的是当时旧文档的阅读位置，于是在文件库里切换文档后一关文件库，
   * 新文档就被拽回旧文档的滚动距离（不够长就滚到底）。阅读位置本来就由本程序自己管
   * （renderReader 会滚到顶部、锚点跳转自己算落点），所以关掉浏览器的自动恢复。 */
  if ('scrollRestoration' in history) { try { history.scrollRestoration = 'manual'; } catch (err) {} }

  function pushLayerGuard() { try { history.pushState({ mdLayer: 1 }, ''); } catch (err) {} }
  function registerLayer(dismiss) {
    mdLayers.push(dismiss);
    if (mdLayers.length === 1) pushLayerGuard();
  }
  function unregisterLayer(dismiss) {
    var i = mdLayers.lastIndexOf(dismiss);
    if (i < 0) return;                    /* 已经不在栈里（是返回键关掉的），什么都不用做 */
    mdLayers.splice(i, 1);
    if (mdLayers.length) return;          /* 还有别的层开着，守卫留给它 */
    mdLayerBack++;
    try { history.back(); } catch (err) { mdLayerBack--; return; }
    /* 万一历史里没有上一条、popstate 不来，超时把计数清掉，免得吃掉下一次返回键 */
    setTimeout(function () { if (mdLayerBack > 0) mdLayerBack--; }, 700);
  }
  window.addEventListener('popstate', function () {
    if (mdLayerBack > 0) { mdLayerBack--; return; }   /* 这是上面 history.back() 的回声 */
    if (!mdLayers.length) return;                    /* 没有二级菜单：正常后退，交给浏览器 */
    mdLayers.pop()();                                /* 先关最上面那一层 */
    if (mdLayers.length) pushLayerGuard();            /* 下面还有层，补一条守卫 */
  });

  /* ---------- 侧边栏开合 ---------- */
  var sidebarLayerOn = false;
  function openSidebar() {
    renderSidebar();
    document.body.classList.add('side-open');
    $('#btnSidebar').classList.add('active');
    if (!sidebarLayerOn) { sidebarLayerOn = true; registerLayer(closeSidebar); }
  }
  function closeSidebar() {
    document.body.classList.remove('side-open');
    $('#btnSidebar').classList.remove('active');
    if (sidebarLayerOn) { sidebarLayerOn = false; unregisterLayer(closeSidebar); }
  }
  $('#btnSidebar').addEventListener('click', function () {
    document.body.classList.contains('side-open') ? closeSidebar() : openSidebar();
  });
  $('#btnCloseSide').addEventListener('click', closeSidebar);
  $('#backdrop').addEventListener('click', closeSidebar);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeZoom();
      closeSidebar();
      disarmClear();
      closeMoreMenu();
    }
  });

  /* ---------- 「更多」菜单 ---------- */
  var btnMore = $('#btnMore'), moreMenu = $('#moreMenu');
  var moreLayerOn = false;
  function openMoreMenu() {
    moreMenu.hidden = false;
    btnMore.classList.add('active');
    if (!moreLayerOn) { moreLayerOn = true; registerLayer(closeMoreMenu); }
  }
  function closeMoreMenu() {
    moreMenu.hidden = true;
    btnMore.classList.remove('active');
    if (moreLayerOn) { moreLayerOn = false; unregisterLayer(closeMoreMenu); }
  }
  function toggleMoreMenu() {
    if (moreMenu.hidden) openMoreMenu(); else closeMoreMenu();
  }
  btnMore.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleMoreMenu();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.more-wrap')) closeMoreMenu();
  });

  /* ---------- 主题 / 字体 / 清空按钮 ---------- */
  btnTheme.addEventListener('click', function () { setTheme(nextTheme()); });
  btnFont.addEventListener('click', function () { setFont(html.dataset.font === 'serif' ? 'sans' : 'serif'); });

  var clearTimer = null;
  function disarmClear() {
    clearTimeout(clearTimer);
    btnClear.classList.remove('arm');
    btnClear.querySelector('.mi-text').textContent = '清空全部文件';
    btnClear.title = '清空全部文件';
  }
  btnClear.addEventListener('click', function (e) {
    e.stopPropagation();
    if (btnClear.classList.contains('arm')) {
      clearAll();
      disarmClear();
      closeMoreMenu();
      showToast('已清空全部文件');
      return;
    }
    if (!state.files.length) return;
    btnClear.classList.add('arm');
    btnClear.querySelector('.mi-text').textContent = '再次点击确认清空';
    btnClear.title = '再次点击确认清空';
    clearTimer = setTimeout(disarmClear, 2400);
  });

  /* ---------- 文件选择 ---------- */
  $('#btnBrowse').addEventListener('click', function () { $('#fileInput').click(); });
  /* 「更多」菜单里的导入（已有文件打开时也能用，不用先清空列表） */
  $('#btnImportFile').addEventListener('click', function (e) {
    e.stopPropagation();
    closeMoreMenu();
    $('#fileInput').click();
  });
  $('#btnImportFolder').addEventListener('click', function (e) {
    e.stopPropagation();
    closeMoreMenu();
    $('#folderInput').click();
  });
  $('#fileInput').addEventListener('change', function () {
    if (this.files && this.files.length) addFiles(this.files);
    this.value = '';
  });

  /* ---------- 文件夹选择（读取其中全部 Markdown，保留相对路径） ---------- */
  $('#btnBrowseFolder').addEventListener('click', function () { $('#folderInput').click(); });
  $('#folderInput').addEventListener('change', function () {
    if (this.files && this.files.length) {
      var md = Array.prototype.filter.call(this.files, isMarkdownFile);
      if (md.length) addFiles(md);
      else showToast('文件夹内没有 Markdown 文件');
    }
    this.value = '';
  });

  /* ---------- 拖拽 ---------- */
  var dragDepth = 0;
  function hasFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    if (!t) return false;
    return Array.prototype.indexOf.call(t, 'Files') >= 0;
  }

  /* 递归收集拖入的目录（webkitGetAsEntry 旧 API），File 对象注入相对路径 */
  function collectEntryFiles(entry, path, out, done) {
    try {
      if (entry.isFile) {
        entry.file(function (file) {
          if (file) {
            try {
              Object.defineProperty(file, 'webkitRelativePath', { value: path ? path + '/' + file.name : '' });
            } catch (e2) {}
            out.push(file);
          }
          done();
        }, function (err) {
          console.error('[MD解析] entry.file 读取失败:', entry && entry.name, err);
          done();
        });
      } else if (entry.isDirectory) {
        var reader = entry.createReader();
        var all = [];
        var readBatch = function () {
          reader.readEntries(function (entries) {
            if (!entries.length) {
              var i = 0;
              (function next() {
                if (i >= all.length) { done(); return; }
                collectEntryFiles(all[i], path ? path + '/' + entry.name : entry.name, out, next);
                i++;
              })();
              return;
            }
            all = all.concat(entries);
            readBatch();
          }, function (err) {
            console.error('[MD解析] 目录读取失败:', entry && entry.name, err);
            showToast('文件夹条目过多，请改用「选择文件夹」按钮导入');
            done();
          });
        };
        readBatch();
      } else {
        console.warn('[MD解析] 未知 entry 类型:', entry);
        done();
      }
    } catch (err) {
      console.error('[MD解析] 目录收集异常:', err);
      done();
    }
  }

  /* 现代 API：FileSystemDirectoryHandle 递归收集（避开 webkitGetAsEntry 的 Data URL 长度限制） */
  async function collectHandle(handle, path, out) {
    try {
      if (handle.kind === 'directory') {
        for await (const entry of handle.entries()) {
          await collectHandle(entry[1], path ? path + '/' + handle.name : handle.name, out);
        }
      } else if (handle.kind === 'file') {
        var file = await handle.getFile();
        if (file) {
          try {
            Object.defineProperty(file, 'webkitRelativePath', { value: path ? path + '/' + file.name : '' });
          } catch (e2) {}
          out.push(file);
        }
      }
    } catch (err) {
      console.error('[MD解析] 句柄读取失败:', handle && handle.name, err);
    }
  }

  window.addEventListener('dragenter', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    var n = e.dataTransfer.items ? e.dataTransfer.items.length : 0;
    dropCount.textContent = (n > 1 ? '导入 ' + n + ' 份文件' : '导入文件') + '（仅接收 Markdown）';
    dropOverlay.classList.add('show');
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function (e) {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dropOverlay.classList.remove('show');
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove('show');
    if (!hasFiles(e)) return;

    /* 路径二/三：旧 API 目录条目 + 普通文件（var 提升，供句柄回退调用） */
    var processDirEntries = function () {
      if (dirEntries.length) {
        var collected = [];
        var pending = dirEntries.length;
        dirEntries.forEach(function (entry) {
          collectEntryFiles(entry, '', collected, function () {
            pending--;
            if (pending === 0) {
              console.debug('[MD解析] 目录收集完成，共', collected.length, '个文件');
              var md = collected.filter(isMarkdownFile);
              if (md.length) {
                addFiles(md);
              } else if (e.dataTransfer.files && e.dataTransfer.files.length) {
                addFiles(e.dataTransfer.files);
              } else {
                showToast('文件夹内没有 Markdown 文件');
              }
            }
          });
        });
        return;
      }
      if (e.dataTransfer.files && e.dataTransfer.files.length) {
        addFiles(e.dataTransfer.files);
      }
    };

    /* 优先用现代 API（getAsFileSystemHandle），失败再退回 webkitGetAsEntry */
    var handles = [];
    var dirEntries = [];
    var useHandles = false;
    if (e.dataTransfer.items) {
      Array.prototype.forEach.call(e.dataTransfer.items, function (item) {
        if (typeof item.getAsFileSystemHandle === 'function') {
          useHandles = true;
          handles.push(item.getAsFileSystemHandle());
        } else {
          try {
            var entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
            if (entry && entry.isDirectory) dirEntries.push(entry);
          } catch (err) {
            console.error('[MD解析] webkitGetAsEntry 异常:', err);
          }
        }
      });
    }
    console.debug('[MD解析] drop 句柄数:', handles.length, '目录数:', dirEntries.length, '文件数:', e.dataTransfer.files ? e.dataTransfer.files.length : 0);

    /* 路径一：现代句柄 */
    if (useHandles && handles.length) {
      Promise.all(handles).then(function (resolved) {
        var valid = resolved.filter(Boolean);
        if (!valid.length) {
          /* 句柄全部失败：回退旧路径 */
          console.debug('[MD解析] 句柄不可用，回退旧 API');
          processDirEntries();
          return;
        }
        var collected = [];
        var jobs = valid.map(function (h) { return collectHandle(h, '', collected); });
        return Promise.all(jobs).then(function () {
          var md = collected.filter(isMarkdownFile);
          console.debug('[MD解析] 句柄收集完成，共', collected.length, '个文件');
          if (md.length) addFiles(md);
          else showToast('文件夹内没有 Markdown 文件');
        });
      });
      return;
    }

    processDirEntries();
  });

  /* ---------- 示例文档 ---------- */
  var SAMPLE_IMG = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' width='900' height='340'>" +
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0' stop-color='#6366f1'/><stop offset='1' stop-color='#a855f7'/>" +
    "</linearGradient></defs>" +
    "<rect width='900' height='340' rx='20' fill='url(#g)'/>" +
    "<text x='450' y='162' font-size='46' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>墨阅 Markdown</text>" +
    "<text x='450' y='218' font-size='22' font-family='sans-serif' fill='white' opacity='0.85' text-anchor='middle'>Drag · Drop · Read</text>" +
    "</svg>"
  );

  var SAMPLE_MD = [
    '# 墨阅解析',
    '',
    '> 拖入即可解析，无需联网，全部渲染在本地完成。多份文件可在右上角侧边栏中随时切换。',
    '',
    '## 功能清单',
    '',
    '- [x] 一次拖入多份 Markdown 文件',
    '- [x] 侧边栏切换文件、移除文件',
    '- [x] 亮色 / 暗色主题 · 衬线 / 黑体切换',
    '- [x] 代码语法高亮（JS / Python / Bash / SQL 等）',
    '- [ ] 导出 PDF（规划中）',
    '',
    '### 常用语法速查',
    '',
    '| 语法 | 写法 | 效果 |',
    '| :--- | :---: | ---: |',
    '| 加粗 | `**文字**` | **文字** |',
    '| 斜体 | `*文字*` | *文字* |',
    '| 删除线 | `~~文字~~` | ~~文字~~ |',
    '| 行内代码 | `` `code` `` | `code` |',
    '| 链接 | `[链接](https://example.com)` | [链接](https://example.com) |',
    '',
    '## 代码高亮',
    '',
    '```js',
    'const greet = (name) => {',
    '  // 打个招呼',
    '  return `你好，${name}！`;',
    '};',
    '',
    'greet("世界");',
    '```',
    '',
    '```python',
    'def fib(n):',
    '    if n <= 1:',
    '        return n',
    '    return fib(n - 1) + fib(n - 2)',
    '```',
    '',
    '```bash',
    'echo "解析完成" && wc -l *.md',
    '```',
    '',
    '## 排版与引用',
    '',
    '这是**加粗**、*斜体*、***粗斜体***、~~删除线~~和 `行内代码`。自动识别裸链接：https://example.com',
    '',
    '> 好的工具应当像空气一样存在。',
    '>',
    '> > 嵌套引用同样支持。',
    '',
    '---',
    '',
    '### 嵌套列表',
    '',
    '1. 一级条目',
    '   - 二级无序条目',
    '   - 另一条',
    '2. 一级条目',
    '   1. 二级有序条目',
    '   2. 继续',
    '3. 一级条目',
    '',
    '![示例横幅](' + SAMPLE_IMG + ')',
    '',
    '*—— 完 ——*'
  ].join('\n');

  $('#btnSample').addEventListener('click', function () {
    addTextFile('示例文档.md', SAMPLE_MD);
    showToast('已载入示例文档');
  });

  /* ---------- 初始化 ---------- */
  disarmClear(); /* 首次打开即渲染「清空」图标，避免按钮空白 */
  renderSidebar();
  renderReader();

  /* 编辑模式布局：手机竖屏 / 窄窗口 / 竖屏电脑窗口 → 上下堆叠（上预览·下编辑） */
  var stackedMQ = window.matchMedia('(max-width: 820px), (orientation: portrait)');
  function updateEditLayout() {
    document.body.classList.toggle('edit-stacked', stackedMQ.matches);
  }
  updateEditLayout();
  if (stackedMQ.addEventListener) stackedMQ.addEventListener('change', updateEditLayout);
  else if (stackedMQ.addListener) stackedMQ.addListener(updateEditLayout);

  /* MathJax / Mermaid 库为 defer 加载：就绪后补渲染当前文档 */
  window.addEventListener('load', function () {
    if (window.MathJax || window.mermaid) postRender();
  });

  /* 调试钩子（浏览器自动化 / 测试用） */
  window.__debug = {
    importText: addTextFile,
    editor: function () { return mdEditor; },
    list: function () { return state.files.map(function (f) { return f.name; }); },
    openSidebar: openSidebar,
    closeSidebar: closeSidebar,
    setTheme: setTheme,
    setFont: setFont,
    touch: function () { if (typeof setupTouchEditor === 'function') setupTouchEditor(); },
    stacked: function (on) { document.body.classList.toggle('edit-stacked', !!on); },
    active: function () { return state.active; },
    errors: function () { return window.__errs.slice(); }
  };
})();
</script>

<script>
/* 首屏前先定主题，避免闪烁 */
(function () {
  try {
    var t = localStorage.getItem('md-theme');
    if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    var f = localStorage.getItem('md-font') || 'serif';
    document.documentElement.dataset.theme = t;
    document.documentElement.dataset.font = f;
  } catch (e) {}
})();
</script>
<!-- MathJax 配置：仅按需渲染（$…$ 行内 / $$…$$ 块级），不自动扫描全文档 -->
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  options: { enableMenu: false, ignoreHtmlClass: 'tex2jax_ignore' },
  startup: { typeset: false }
};
</script>

<style>
/* ============ 基础 & 主题变量 ============ */
:root {
  --font-ui: "Inter", -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  --font-content: Georgia, "Times New Roman", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --radius: 18px;
}
[data-font="sans"] {
  --font-content: var(--font-ui);
}
:root {
  /* 暗色（默认） */
  --bg: #0c0c11;
  --bg-a: rgba(99, 102, 241, 0.16);
  --bg-b: rgba(168, 85, 247, 0.12);
  --card: #14141b;
  --surface-1: rgba(255, 255, 255, 0.03);
  --surface-2: rgba(255, 255, 255, 0.055);
  --text: #dcdce4;
  --text-2: #9696a3;
  --text-3: #63637a;
  --text-strong: #f2f2f8;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --accent: #818cf8;
  --accent-2: #c084fc;
  --on-accent: #ffffff;
  --panel: rgba(18, 18, 26, 0.72);
  --panel-strong: rgba(15, 15, 23, 0.94);
  --code-bg: #0b0b11;
  --code-border: rgba(255, 255, 255, 0.07);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45), 0 14px 40px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 10px 32px rgba(0, 0, 0, 0.5), 0 32px 80px rgba(0, 0, 0, 0.45);
  --overlay: rgba(5, 5, 12, 0.55);
  --t-kw: #c792ea; --t-str: #9ece6a; --t-com: #5f6472; --t-num: #f78c6c; --t-fn: #82aaff;
}
[data-theme="light"] {
  --bg: #f2f2f5;
  --bg-a: rgba(99, 102, 241, 0.13);
  --bg-b: rgba(168, 85, 247, 0.09);
  --card: #ffffff;
  --surface-1: rgba(20, 20, 40, 0.03);
  --surface-2: rgba(20, 20, 40, 0.05);
  --text: #26262e;
  --text-2: #64646f;
  --text-3: #9c9ca8;
  --text-strong: #131318;
  --border: rgba(20, 20, 40, 0.09);
  --border-strong: rgba(20, 20, 40, 0.17);
  --accent: #5b5bd6;
  --accent-2: #8b5cf6;
  --on-accent: #ffffff;
  --panel: rgba(255, 255, 255, 0.78);
  --panel-strong: rgba(255, 255, 255, 0.92);
  --code-bg: #181820;
  --code-border: rgba(255, 255, 255, 0.08);
  --shadow-sm: 0 1px 2px rgba(20, 20, 40, 0.05), 0 4px 14px rgba(20, 20, 40, 0.06);
  --shadow-md: 0 6px 20px rgba(20, 20, 40, 0.08), 0 14px 40px rgba(20, 20, 40, 0.09);
  --shadow-lg: 0 10px 32px rgba(20, 20, 40, 0.10), 0 32px 80px rgba(20, 20, 40, 0.12);
  --overlay: rgba(10, 10, 24, 0.45);
  --t-kw: #9d3dcf; --t-str: #4e9a3a; --t-com: #8b8b9a; --t-num: #d9730d; --t-fn: #2f6fbf;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
/* 主题切换过渡：只在切换瞬间由 JS 给 <html> 加 .theme-anim（常驻会拖慢滚动与交互） */
@media (prefers-reduced-motion: no-preference) {
  html.theme-anim,
  html.theme-anim *,
  html.theme-anim *::before,
  html.theme-anim *::after {
    transition: background-color .34s ease, color .34s ease, border-color .34s ease,
                fill .34s ease, stroke .34s ease, box-shadow .34s ease !important;
    transition-delay: 0s !important;
  }
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 背景光晕 ============ */
.bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-blobs i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .8; }
.bg-blobs i:nth-child(1) { width: 560px; height: 560px; left: -160px; top: -180px; background: var(--bg-a); animation: drift 26s ease-in-out infinite alternate; }
.bg-blobs i:nth-child(2) { width: 640px; height: 640px; right: -220px; bottom: -240px; background: var(--bg-b); animation: drift 32s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 40px) scale(1.12); } }

/* ============ 顶栏 ============ */
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 70;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 18px 20px; pointer-events: none; gap: 12px;
}
.topbar > * { pointer-events: auto; }
.brand {
  display: flex; align-items: center; gap: 10px; max-width: 46vw;
  background: var(--panel); backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 16px 6px 6px; box-shadow: var(--shadow-sm);
  font-size: 14px; font-weight: 650; color: var(--text-strong);
}
.logo-mark {
  width: 30px; height: 30px; flex: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: var(--on-accent);
  font-size: 15px; font-weight: 800; letter-spacing: 0;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent);
}
.brand-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); font-weight: 500; font-size: 13px; }
.toolbar {
  display: flex; align-items: center; gap: 4px;
  background: var(--panel); backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px; box-shadow: var(--shadow-md);
}
.tool-btn {
  position: relative;
  width: 34px; height: 34px; border: 0; border-radius: 999px;
  background: transparent; color: var(--text-2);
  display: grid; place-items: center; cursor: pointer;
  transition: background .18s, color .18s, transform .12s;
}
.tool-btn:hover { background: var(--surface-2); color: var(--text-strong); }
.tool-btn:active { transform: scale(.92); }
.tool-btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tool-btn .badge {
  position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--on-accent); font-size: 10.5px; font-weight: 700; line-height: 17px; text-align: center;
  box-shadow: 0 0 0 2px var(--bg);
}
.tool-btn#btnSidebar.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
.tool-btn#btnEdit.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
.tool-btn#btnMore.active { background: var(--surface-2); color: var(--text-strong); }

/* ===== 「更多」面板：从更多按钮处向左展开 ===== */
.more-wrap { position: relative; display: flex; }
.more-menu {
  position: absolute; right: 0; top: calc(100% + 10px);
  min-width: 200px; padding: 6px;
  background: var(--panel-strong);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; gap: 2px;
  z-index: 90;
  animation: menuIn .16s cubic-bezier(.22, .9, .24, 1) both;
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
.more-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; border: 0; background: transparent; color: var(--text-2);
  font-family: var(--font-ui); font-size: 13px; font-weight: 550;
  padding: 9px 12px; border-radius: 9px; cursor: pointer; text-align: left;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.more-item:hover { background: var(--surface-2); color: var(--text-strong); }
.more-item .mi-icon { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
.more-item .mi-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.more-item.danger { color: #ef4444; }
.more-item.danger:hover { background: color-mix(in srgb, #ef4444 14%, transparent); color: #ef4444; }
.more-item.arm .mi-text { color: #ef4444; font-weight: 700; }
.more-sep { height: 1px; background: var(--border); margin: 5px 8px; }
.tool-btn#btnFont { font-size: 13px; font-weight: 700; font-family: var(--font-content, var(--font-ui)); letter-spacing: -.5px; }
.tool-sep { width: 1px; height: 18px; background: var(--border-strong); margin: 0 4px; }
.btn-ghost-text {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-2); border-radius: 999px; padding: 6px 13px;
  font-family: var(--font-ui); font-size: 12.5px; font-weight: 550; cursor: pointer;
  transition: all .18s;
}
.btn-ghost-text:hover { color: var(--text-strong); background: var(--surface-2); border-color: var(--border-strong); }
.btn-ghost-text svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ============ 主体：窄体竖状阅读栏 ============ */
main {
  position: relative; z-index: 1;
  padding: 96px 20px 64px;
  display: flex; flex-direction: column; align-items: center;
}
.card {
  width: 100%;
  max-width: min(920px, 94vw, calc(100vh * 0.62));
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: clamp(26px, 5vw, 60px) clamp(22px, 6vw, 68px);
}

/* ===== 编辑模式：左编辑 · 右预览（两栏等宽带状，整体居中，相接处为中线） ===== */
body.edit-mode main {
  flex-direction: row; align-items: stretch; justify-content: center;
  padding: 96px 0 0; gap: 0; height: 100vh; box-sizing: border-box;
}
body.edit-mode main > .card { border-radius: 0; box-shadow: none; }
#editorPane {
  display: flex; flex-direction: column;
  flex: 0 0 auto;
  width: min(920px, 94vw, calc(100vh * 0.62)); /* 与阅读栏同宽 */
  height: 100%;
  background: var(--card);
  border-right: 1px solid var(--border-strong); /* 中线 */
  box-shadow: var(--shadow-md);
  min-width: 0;
}
.editor-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  flex: none;
}
.editor-bar > svg { width: 15px; height: 15px; stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.editor-file-name {
  font-family: var(--font-ui); font-size: 13px; font-weight: 650;
  color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.editor-stats { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.editor-bar .btn-ghost-text { margin-left: auto; }
#editorHost {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  background: var(--card);
}
/* Monaco 的折行缩进由 wrappingIndent: same 提供（续行对齐逻辑行首缩进，Notepad3 式） */
#editorHost .monaco-editor { padding: 0; }
/* 滚动条与预览区同款：10px 宽、圆角、同色（--border-strong） */
#editorHost .monaco-scrollable-element > .scrollbar.vertical { width: 10px !important; }
#editorHost .monaco-scrollable-element > .scrollbar > .slider {
  background: var(--border-strong) !important;
  border-radius: 8px;
}
#editorHost .monaco-scrollable-element > .scrollbar > .slider:hover,
#editorHost .monaco-scrollable-element > .scrollbar > .slider.active {
  background: var(--text-3) !important;
}
/* 拖放落点指示线（内部拖动 / 外部文本拖入的光标预览）用主题色 */
#editorHost .monaco-editor .dnd-target { border-right-color: var(--accent) !important; }
/* 触屏：Monaco 隐藏 textarea 不接收触摸（否则滑动/点按会被浏览器原生聚焦弹键盘） */
#editorHost .monaco-editor textarea { pointer-events: none; }
/* 触屏长按选择手柄（Android 风格选择滑块） */
.md-sel-handle {
  position: absolute; z-index: 120; display: none;
  width: 26px; height: 26px; margin: -13px 0 0 -13px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--on-accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent), 0 2px 10px rgba(0, 0, 0, 0.45);
  pointer-events: auto; touch-action: none;
}
.md-sel-handle.on { display: block; }
/* mermaid 图表可点击放大（信息多时看大字） */
.markdown-body .mermaid svg { cursor: zoom-in; }
/* mermaid 图表放大浮层 */
.md-zoom-overlay {
  position: fixed; inset: 0; z-index: 999; display: none;
  align-items: center; justify-content: flex-start;
  background: rgba(5, 5, 12, 0.82); backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 28px; overflow: auto; cursor: zoom-out;
}
.md-zoom-overlay.show { display: flex; flex-direction: column; }
.md-zoom-overlay .md-zoom-box { margin: auto; cursor: default; }
.md-zoom-overlay svg {
  display: block; max-width: calc(100vw - 56px); max-height: 88vh;
  background: #fff; border-radius: 12px; box-shadow: var(--shadow-lg);
}
.md-zoom-overlay .md-zoom-close {
  position: fixed; top: 14px; right: 14px; width: 38px; height: 38px;
  border-radius: 50%; border: 1px solid var(--border-strong);
  background: var(--panel-strong); color: var(--text);
  font-size: 22px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.md-zoom-overlay .md-zoom-close:hover { background: var(--surface-2); }
body.edit-mode #reader {
  flex: 0 0 auto;
  width: min(920px, 94vw, calc(100vh * 0.62)); /* 与编辑区同宽，相接处即页面中线 */
  max-width: none;
  height: 100%;
  overflow-y: auto; padding: clamp(22px, 4vw, 44px) clamp(20px, 5vw, 52px);
  border-radius: 0; box-shadow: none; min-width: 0;
}

/* 编辑模式堆叠排布（手机竖屏 / 窄窗口 / 竖屏电脑窗口）：上预览 · 下编辑。
   由 JS 按 matchMedia('(max-width: 820px), (orientation: portrait)') 给 body 加 .edit-stacked */
body.edit-mode.edit-stacked main { flex-direction: column; padding: 84px 0 0; }
body.edit-mode.edit-stacked #reader { order: 1; width: 100%; height: 50%; max-width: none; border-bottom: 1px solid var(--border-strong); }
body.edit-mode.edit-stacked #editorPane { order: 2; width: 100%; height: 50%; border-right: 0; box-shadow: none; }

/* 空状态 */
#empty { min-height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.empty-icon {
  width: 88px; height: 88px; border-radius: 26px; margin-bottom: 10px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent-2) 14%, transparent));
  border: 1px solid var(--border);
  display: grid; place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  cursor: pointer;
  transition: transform .2s cubic-bezier(.22, .9, .24, 1), box-shadow .2s, border-color .2s;
}
.empty-icon:hover { transform: translateY(-3px) scale(1.03); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 22%, transparent); }
.empty-icon:active { transform: scale(.97); }
.empty-icon svg { width: 40px; height: 40px; stroke: var(--accent); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#empty h1 { margin: 6px 0 0; font-size: 22px; font-weight: 750; letter-spacing: -0.01em; color: var(--text-strong); font-family: var(--font-ui); }
#empty p { margin: 4px 0 20px; font-size: 13.5px; color: var(--text-2); }
.empty-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn-primary {
  border: 0; cursor: pointer; border-radius: 999px; padding: 10px 22px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--on-accent); font-family: var(--font-ui); font-size: 13.5px; font-weight: 650;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 38%, transparent);
  transition: transform .15s, box-shadow .2s, filter .2s;
}
.btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 48%, transparent); }
.btn-primary:active { transform: scale(.97); }
.btn-ghost {
  border: 1px solid var(--border); cursor: pointer; border-radius: 999px; padding: 10px 22px;
  background: var(--surface-1); color: var(--text-2);
  font-family: var(--font-ui); font-size: 13.5px; font-weight: 600;
  transition: all .18s;
}
.btn-ghost:hover { color: var(--text-strong); border-color: var(--border-strong); background: var(--surface-2); }

/* 错误卡片 */
#errorCard { text-align: center; padding-top: 64px; padding-bottom: 64px; }
.err-icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center; background: color-mix(in srgb, #ef4444 14%, transparent); border: 1px solid color-mix(in srgb, #ef4444 30%, transparent); }
.err-icon svg { width: 32px; height: 32px; stroke: #ef4444; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#errorCard h2 { margin: 0 0 8px; font-size: 18px; color: var(--text-strong); }
#errorCard p { margin: 0; font-size: 13.5px; color: var(--text-2); }

/* 文档头部 */
.doc-head { margin-bottom: 6px; }

.ext-chip {
  flex: none; font-family: var(--font-ui); font-size: 11px; font-weight: 750; letter-spacing: .07em;
  padding: 3px 9px; border-radius: 999px; text-transform: lowercase;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}

/* ============ Markdown 渲染区 ============ */
.markdown-body {
  font-family: var(--font-content);
  font-size: 16px; line-height: 1.9; color: var(--text);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.markdown-body > :first-child { margin-top: 0; }
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  font-family: var(--font-ui); font-weight: 720; letter-spacing: -0.012em;
  color: var(--text-strong); line-height: 1.4; margin: 1.7em 0 .65em;
}
.markdown-body h1 { font-size: 1.75em; padding-bottom: .45em; border-bottom: 1px solid var(--border); }
.markdown-body h2 { font-size: 1.42em; position: relative; padding-left: 15px; }
.markdown-body h2::before {
  content: ''; position: absolute; left: 0; top: .16em; bottom: .16em; width: 4px;
  border-radius: 4px; background: linear-gradient(180deg, var(--accent), var(--accent-2));
}
.markdown-body h3 { font-size: 1.18em; }
.markdown-body h4 { font-size: 1.03em; }
.markdown-body p { margin: .95em 0; }
.markdown-body a {
  color: var(--accent); text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  transition: border-color .15s;
}
.markdown-body a:hover { border-bottom-color: var(--accent); }
.markdown-body strong { color: var(--text-strong); font-weight: 700; }
.markdown-body del { color: var(--text-3); }
.markdown-body code {
  font-family: var(--font-mono); font-size: .86em;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: .14em .42em;
  color: color-mix(in srgb, var(--accent) 78%, var(--text));
  white-space: pre-wrap; word-break: break-word;
}
.markdown-body pre {
  position: relative; margin: 1.25em 0; padding: 1.05em 1.2em;
  background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: 13px; overflow: auto; line-height: 1.65;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03), var(--shadow-sm);
}
.markdown-body pre code { background: none; border: 0; padding: 0; color: #d8d8e4; font-size: .86em; white-space: pre; word-break: normal; }
.markdown-body pre[data-lang]::after {
  content: attr(data-lang); position: absolute; top: 9px; right: 13px;
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: rgba(255,255,255,.32);
}
.markdown-body pre .t-kw { color: var(--t-kw); }
.markdown-body pre .t-str { color: var(--t-str); }
.markdown-body pre .t-com { color: var(--t-com); font-style: italic; }
.markdown-body pre .t-num { color: var(--t-num); }
.markdown-body pre .t-fn { color: var(--t-fn); }
.markdown-body blockquote {
  margin: 1.25em 0; padding: .55em 1.25em .55em 1.15em;
  border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent);
  color: var(--text-2);
}
.markdown-body blockquote p { margin: .45em 0; }
.markdown-body blockquote blockquote { margin: .6em 0 .2em; }
.markdown-body ul, .markdown-body ol { margin: .95em 0; padding-left: 1.6em; }
.markdown-body li { margin: .32em 0; }
.markdown-body li::marker { color: var(--accent); font-weight: 600; }
.markdown-body li > ul, .markdown-body li > ol { margin: .25em 0; }
.markdown-body li.task { list-style: none; margin-left: -1.35em; display: flex; align-items: baseline; gap: .45em; }
.markdown-body li.task input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  width: 1.02em; height: 1.02em; margin: 0; flex: none;
  border: 1.5px solid var(--border-strong); border-radius: 4px;
  background: transparent; position: relative; top: .18em; cursor: default;
  transition: background .15s, border-color .15s;
}
.markdown-body li.task input[type="checkbox"]:checked {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
}
.markdown-body li.task input[type="checkbox"]:checked::after {
  content: ''; position: absolute; left: 3.4px; top: 1.2px;
  width: 4.6px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.markdown-body li.task.done > span { color: var(--text-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--text-3) 55%, transparent); }
.markdown-body table { border-collapse: collapse; width: 100%; margin: 1.25em 0; font-size: .92em; overflow: hidden; border-radius: 10px; }
.markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: .55em .8em; }
.markdown-body thead th { background: var(--surface-2); font-weight: 650; color: var(--text-strong); font-family: var(--font-ui); font-size: .95em; }
.markdown-body tbody tr:nth-child(even) td { background: var(--surface-1); }
.markdown-body img { display: block; max-width: 100%; height: auto; margin: 1.2em auto; border-radius: 12px; box-shadow: var(--shadow-sm); }
/* 独占一段的图（logo / 徽标）给个下限：不少 SVG 图标自带 width="1em"，按原尺寸只有 16px 太小 */
.markdown-body p > img:only-child,
.markdown-body p > a:only-child > img:only-child { min-width: min(3em, 100%); }
.markdown-body hr {
  border: 0; height: 1px; width: 58%; margin: 2.2em auto;
  background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
}
/* ===== 数学公式 ===== */
.markdown-body .math-inline { white-space: nowrap; }
.markdown-body .math-block {
  margin: 1.2em auto; overflow-x: auto; text-align: center;
  padding: .4em 0;
}
.markdown-body mjx-container { overflow-x: auto; }
/* ===== Mermaid 图 ===== */
.markdown-body .mermaid {
  margin: 1.2em 0; padding: 1em 1.2em;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 13px; text-align: center; overflow-x: auto;
  font-family: var(--font-mono); font-size: .85em; line-height: 1.5;
  white-space: pre; color: var(--text-2);
}
.markdown-body .mermaid svg { max-width: 100%; height: auto; margin: 0 auto; }
/* ===== 脚注 ===== */
.markdown-body .footnote-ref a {
  font-size: .72em; vertical-align: super; line-height: 0;
  color: var(--accent); text-decoration: none;
  border-bottom: 0; margin: 0 .1em;
}
.markdown-body .footnote-ref a:hover { text-decoration: underline; }
.markdown-body .footnotes {
  margin-top: 2.4em; font-size: .85em; color: var(--text-2);
}
.markdown-body .footnotes hr { width: 100%; margin: 0 0 1em; }
.markdown-body .footnotes ol { padding-left: 1.4em; margin: 0; }
.markdown-body .footnotes li { margin: .35em 0; }
.markdown-body .footnote-back {
  margin-left: .4em; color: var(--accent); text-decoration: none;
  border-bottom: 0; font-size: .95em; white-space: nowrap;
}
.markdown-body .footnote-back:hover { text-decoration: underline; }
/* 跳转落点高亮（脚注条目 / 正文引用上标 / 标题锚点） */
.markdown-body .footnotes li:target,
.markdown-body .footnotes li.fn-flash {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border-radius: 6px; padding: .1em .4em;
}
.markdown-body .footnote-ref:target a,
.markdown-body .footnote-ref.fn-flash a {
  background: color-mix(in srgb, var(--accent) 22%, transparent);
  border-radius: 4px; padding: 0 .2em;
}
/* 标题锚点落点：只画底色 + 外扩光圈，不加内边距，避免高亮时版面跳动 */
.markdown-body :is(h1, h2, h3, h4, h5, h6).fn-flash {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border-radius: 8px;
  box-shadow: 0 0 0 .35em color-mix(in srgb, var(--accent) 14%, transparent);
}

/* ===== 隐藏内容遮罩（||spoiler||，Discord 同款：黑条遮住，点击显示） ===== */
.markdown-body .spoiler {
  background: color-mix(in srgb, var(--text) 26%, transparent);
  color: transparent;
  border-radius: 5px; padding: 0 .22em;
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
  transition: background-color .16s ease, color .16s ease;
}
.markdown-body .spoiler:hover { background: color-mix(in srgb, var(--text) 34%, transparent); }
.markdown-body .spoiler:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.markdown-body .spoiler.revealed {
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  color: inherit; cursor: text;
  -webkit-user-select: auto; user-select: auto;
}

/* ============ 拖拽浮层 ============ */
#dropOverlay {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-items: center;
  background: var(--overlay); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  opacity: 0; visibility: hidden; transition: opacity .28s, visibility .28s;
  pointer-events: none;
}
#dropOverlay.show { opacity: 1; visibility: visible; }
.drop-inner {
  border: 2px dashed rgba(255,255,255,.38); border-radius: 30px;
  padding: 52px 76px; text-align: center; color: #fff;
  transform: scale(.96); transition: transform .28s cubic-bezier(.22,.9,.24,1);
}
#dropOverlay.show .drop-inner { transform: scale(1); }
.drop-inner svg { width: 52px; height: 52px; stroke: #fff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; animation: dropbounce 1.6s ease-in-out infinite; }
@keyframes dropbounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
.drop-inner h2 { margin: 16px 0 4px; font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.drop-inner p { margin: 0; font-size: 14px; color: rgba(255,255,255,.72); }

/* ============ 侧边栏 ============ */
#backdrop {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(4, 4, 10, 0.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s;
}
body.side-open #backdrop { opacity: 1; visibility: visible; }
#sidebar {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
  width: min(340px, 88vw);
  display: flex; flex-direction: column;
  background: var(--panel-strong);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border-left: 1px solid var(--border);
  transform: translateX(calc(100% + 40px));
  transition: transform .5s cubic-bezier(.22, .9, .24, 1);
  box-shadow: none;
}
body.side-open #sidebar { transform: none; box-shadow: -24px 0 60px rgba(0,0,0,.35); }
.side-head { display: flex; align-items: center; gap: 10px; padding: 30px 18px 12px; }
.side-head h2 { margin: 0; font-size: 15.5px; font-weight: 750; letter-spacing: -0.01em; color: var(--text-strong); }
.side-count {
  font-size: 11px; font-weight: 700; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius: 999px; padding: 2px 9px;
}
.side-close { margin-left: auto; }
#fileList { flex: 1; overflow-y: auto; padding: 6px 10px 10px; margin: 0; list-style: none; }
.file-item {
  position: relative; display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 12px; cursor: pointer;
  transition: background .16s; margin-bottom: 2px;
}
.file-item:hover { background: var(--surface-2); }
.file-item.active { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 15%, transparent), color-mix(in srgb, var(--accent) 4%, transparent)); }
.file-item.active::before {
  content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px;
  border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2));
}
.f-icon {
  width: 38px; height: 38px; flex: none; border-radius: 11px;
  display: grid; place-items: center; background: var(--surface-2);
  border: 1px solid var(--border);
}
.f-icon svg { width: 18px; height: 18px; stroke: var(--fcolor, var(--text-2)); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.f-icon.ext-md { --fcolor: var(--accent); }

}

.f-del svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }

/* ===== 文件库树形结构（文件夹按原路径分支显示） ===== */
.tree-folder { list-style: none; }

/* ============ Toast ============ */
#toast {
  position: fixed; left: 50%; top: 78px; z-index: 100;
  transform: translate(-50%, -10px) scale(.96);
  background: rgba(14, 14, 24, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);

/* ============ 响应式 ============ */

<script>
'use strict';
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push(String(e.message)); });

(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var html = document.documentElement;

  /* ================================================================
   * 一、Markdown 解析器（纯本地，无依赖）
   * ================================================================ */
  var isBlank = function (l) { return /^\s*$/.test(l); };
  var isHr = function (l) { return /^ {0,3}([-_*])(?:[ \t]*\1){2,}[ \t]*$/.test(l); };
  var fenceRe = /^ {0,3}(```+|~~~+)\s*(\S*)\s*$/;
  var atxRe = /^ {0,3}(#{1,6})\s+(.+)$/;
  var quoteRe = /^ {0,3}>/;
  var listRe = /^(\s*)([*+-]|\d{1,9}[.)])(\s+)(.*)$/;
  var isList = function (l) { return listRe.test(l); };
  var isBlockStart = function (l) { return fenceRe.test(l) || isHr(l) || atxRe.test(l); };

  function parseBlocks(src) {
    var lines = String(src).replace(/^\uFEFF/, '').split(/\r\n|\r|\n/);
    var blocks = [], i = 0, n = lines.length;

    while (i < n) {
      var line = lines[i];
      if (isBlank(line)) { i++; continue; }

      /* 围栏代码块 */
      var fm = fenceRe.exec(line);
      if (fm) {
        var mk = fm[1][0], lang = fm[2], code = [];
        i++;
        while (i < n) {
          var cm = lines[i].match(/^ {0,3}(`+|~+)\s*$/);
          if (cm && cm[1][0] === mk && cm[1].length >= fm[1].length) { i++; break; }
          code.push(lines[i]); i++;
        }
        blocks.push({ type: 'code', lang: lang, code: code.join('\n') });
        continue;
      }

      /* 块级数学（$$...$$） */
      if (line.indexOf('$$') >= 0) {
        var mathInline = line.match(/^\$\$(.*?)\$\$\s*$/);
        if (mathInline && mathInline[1].trim()) {
          blocks.push({ type: 'math', tex: mathInline[1].trim() });
          i++; continue;
        }
        if (/^\$\$\s*$/.test(line)) {
          var tex = [];
          i++;
          while (i < n && !/^\$\$\s*$/.test(lines[i])) { tex.push(lines[i]); i++; }
          if (i < n) i++; /* 跳过闭合 $$ */
          var texJoined = tex.join('\n').trim();
          if (texJoined) blocks.push({ type: 'math', tex: texJoined });
          continue;
        }
      }

      if (isHr(line)) { blocks.push({ type: 'hr' }); i++; continue; }

      /* ATX 标题 */
      var am = atxRe.exec(line);
      if (am) {
        blocks.push({ type: 'h', level: am[1].length, text: am[2].replace(/\s*#+\s*$/, '') });
        i++; continue;
      }

      /* 引用块（递归解析内部） */
      if (quoteRe.test(line)) {
        var q = [];
        while (i < n && (quoteRe.test(lines[i]) || (isBlank(lines[i]) && i + 1 < n && quoteRe.test(lines[i + 1])))) {
          q.push(isBlank(lines[i]) ? '' : lines[i].replace(/^ {0,3}> ?/, ''));
          i++;
        }
        blocks.push({ type: 'quote', inner: q.join('\n') });
        continue;
      }

      /* 列表（整块收集后递归解析）
       * 一块只收同一种列表：有序 ↔ 无序在 CommonMark 里就是两个列表。
       * 若并成一块，有序项会被顺带渲染成无序（标签只取首项），且块内空行会把整块判为 loose，
       * 于是每项外面套一层 <p>（.markdown-body p 有 .95em 上下边距）——表现为行距突然变大 */
      if (isList(line)) {
        var itemIndent = line.match(/^\s*/)[0].length;
        var orderedList = /\d/.test(listRe.exec(line)[2]);
        var sameKind = function (l) {
          var mm = listRe.exec(l);
          return !!mm && /\d/.test(mm[2]) === orderedList;
        };
        var region = [];
        while (i < n) {
          var l = lines[i];
          if (isBlank(l)) {
            var j = i;
            while (j < n && isBlank(lines[j])) j++;
            if (j >= n) break;
            var indN = lines[j].match(/^\s*/)[0].length;
            /* 同级但换了列表类型 → 另一个列表，另起一块 */
            if (isList(lines[j]) && indN === itemIndent && !sameKind(lines[j])) break;
            if ((isList(lines[j]) && indN >= itemIndent) || (indN > itemIndent && !isBlockStart(lines[j]))) { region.push(l); i++; continue; }
            break;
          }
          var ind = l.match(/^\s*/)[0].length;
          if (isBlockStart(l)) break;
          /* 紧邻的同类项才属于本列表（缩进更深的子列表仍归入本块） */
          if (isList(l) && ind === itemIndent && !sameKind(l)) break;
          if (ind >= itemIndent) { region.push(l); i++; continue; }
          break;
        }
        blocks.push({ type: 'list', region: region.join('\n') });
        continue;
      }

      /* 缩进代码块（4 空格 / Tab） */
      if (line.indexOf('\t') === 0 || line.match(/^\s*/)[0].length >= 4) {
        var ic = [];
        while (i < n && (lines[i].indexOf('\t') === 0 || lines[i].match(/^\s*/)[0].length >= 4 || isBlank(lines[i]))) {
          ic.push(lines[i].replace(/^ {4}|\t/, ''));
          i++;
        }
        while (ic.length && isBlank(ic[ic.length - 1])) ic.pop();
        if (ic.length) { blocks.push({ type: 'code', lang: '', code: ic.join('\n') }); continue; }
      }

      /* 表格 */
      if (line.indexOf('|') >= 0) {
        var sep = lines[i + 1];
        if (sep && /^\s*\|?[\s:\-|]+\|?\s*$/.test(sep) && sep.indexOf('|') >= 0 && /-/.test(sep)) {
          var header = splitRow(line);
          var aligns = splitRow(sep).map(function (c) {
            c = c.trim();
            if (!/^:?-+:?$/.test(c)) return null;
            var l = c.charAt(0) === ':';
            var r = c.charAt(c.length - 1) === ':';
            return l && r ? 'center' : l ? 'left' : r ? 'right' : null; /* 无冒号 = 默认左对齐 */
          });
          var rows = [];
          i += 2;
          while (i < n && !isBlank(lines[i]) && lines[i].indexOf('|') >= 0 && !isBlockStart(lines[i])) {
            rows.push(splitRow(lines[i])); i++;
          }
          blocks.push({ type: 'table', header: header, aligns: aligns, rows: rows });
          continue;
        }
      }

      /* 段落（含 Setext 标题） */
      var para = [line]; i++;
      while (i < n) {
        var pl = lines[i];
        if (isBlank(pl)) break;
        if (/^\s*=+\s*$/.test(pl)) { blocks.push({ type: 'h', level: 1, text: para.join('\n') }); i++; para.length = 0; break; }
        if (/^\s*-+\s*$/.test(pl)) { blocks.push({ type: 'h', level: 2, text: para.join('\n') }); i++; para.length = 0; break; }
        if (isBlockStart(pl) || quoteRe.test(pl) || isList(pl)) break;
        para.push(pl); i++;
      }
      if (para.length) blocks.push({ type: 'p', text: para.join('\n') });
    }
    return blocks;
  }

  function splitRow(r) {
    var s = r.trim();
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.slice(-1) === '|') s = s.slice(0, -1);
    return s.split('|').map(function (c) { return c.trim(); });
  }

  /* 列表区域解析：返回 { items, loose } */
  function parseListRegion(region) {
    var lines = region.split('\n');
    var items = [], i = 0, n = lines.length;
    var loose = false;
    var seenContent = false;
    for (var k = 0; k < n; k++) {
      if (isBlank(lines[k])) { if (seenContent) loose = true; }
      else seenContent = true;
    }
    while (i < n) {
      var m = listRe.exec(lines[i]);
      if (!m) { i++; continue; }
      var indent = m[1].length;
      var marker = m[2];
      var ordered = /\d/.test(marker);
      var startNum = ordered ? parseInt(marker, 10) : 1;
      var content = [m[4]];
      i++;
      while (i < n) {
        var l = lines[i];
        if (isBlank(l)) {
          var j = i;
          while (j < n && isBlank(lines[j])) j++;
          if (j >= n) break;
          var nm = listRe.exec(lines[j]);
          if (nm && nm[1].length === indent) { content.push(''); i++; continue; }
          if (nm && nm[1].length > indent) { i = j; continue; }
          if (!nm && lines[j].match(/^\s*/)[0].length > indent && !isBlockStart(lines[j])) { content.push(''); i++; continue; }
          break;
        }
        var nm2 = listRe.exec(l);
        if (nm2 && nm2[1].length === indent) break;
        if (nm2 && nm2[1].length < indent) break;
        if (isBlockStart(l) && !nm2) break;
        var stripLen = Math.min(indent + marker.length + (m[3].length ? 1 : 0), l.match(/^\s*/)[0].length);
        content.push(l.slice(stripLen));
        i++;
      }
      items.push({ ordered: ordered, startNum: startNum, indent: indent, marker: marker, content: content.join('\n') });
      if (i < n && !listRe.test(lines[i])) break;
    }
    return { items: items, loose: loose };
  }

  /* 从 s[start]（应为 '('）起，找到与之配对的 ')'，返回 { inner, end }；支持嵌套括号 */
  function matchDest(s, start) {
    var depth = 0;
    for (var i = start; i < s.length; i++) {
      var ch = s[i];
      if (ch === '(') depth++;
      else if (ch === ')') {
        depth--;
        if (depth === 0) return { inner: s.slice(start + 1, i), end: i + 1 };
      } else if (ch === '\n') return null;
    }
    return null;
  }

  /* 扫描 ![alt](url) 与 [text](url)；URL 支持成对括号与可选 title；命中处用占位符保护。
   * 分两阶段：先图片后链接，使 [![alt](img)](url) 这类"链接内嵌图片"能正确解析。
   * ph 为外层共享的占位符数组：链接文字 / 隐藏内容里再解析出的占位符也用同一份索引，避免索引串号丢内容 */
  function scanLinks(s, push, opts, ph) {
    /* 阶段 1：图片 */
    var out1 = '', i = 0, n = s.length;
    while (i < n) {
      var ch = s[i];
      if (ch === '!' && s[i + 1] === '[') {
        var ts = i + 2;
        var cl = s.indexOf(']', ts);
        if (cl > -1 && s[cl + 1] === '(') {
          var d = matchDest(s, cl + 1);
          if (d) {
            var alt = s.slice(ts, cl);
            var dest = d.inner.trim();
            var url = dest, title = '';
            var ws = dest.search(/\s/);
            if (ws > -1) {
              url = dest.slice(0, ws);
              title = dest.slice(ws).trim().replace(/^["']|["']$/g, '');
            }
            out1 += push('<img src="' + esc(safeUrl(url, true)) + '" alt="' + (alt || '') + '"' + (title ? ' title="' + esc(title) + '"' : '') + ' loading="lazy">');
            i = d.end;
            continue;
          }
        }
      }
      out1 += ch;
      i++;
    }
    /* 阶段 2：链接（text 中已含图片占位符） */
    if (opts.noLinks) return out1;
    var out2 = '', i2 = 0, n2 = out1.length;
    while (i2 < n2) {
      var ch2 = out1[i2];
      if (ch2 === '[') {
        var ts2 = i2 + 1;
        var cl2 = out1.indexOf(']', ts2);
        if (cl2 > -1 && out1[cl2 + 1] === '(') {
          var d2 = matchDest(out1, cl2 + 1);
          if (d2) {
            var text2 = out1.slice(ts2, cl2);
            var dest2 = d2.inner.trim();
            var url2 = dest2, title2 = '';
            var ws2 = dest2.search(/\s/);
            if (ws2 > -1) {
              url2 = dest2.slice(0, ws2);
              title2 = dest2.slice(ws2).trim().replace(/^["']|["']$/g, '');
            }
            var inner = inline(text2, { noLinks: true, escaped: true, noRestore: true, _ph: ph });
            var ext = /^https?:/i.test(url2);
            out2 += push('<a href="' + esc(safeUrl(url2)) + '"' + (ext ? ' target="_blank" rel="noopener noreferrer"' : '') + (title2 ? ' title="' + esc(title2) + '"' : '') + '>' + inner + '</a>');
            i2 = d2.end;
            continue;
          }
        }
      }
      out2 += ch2;
      i2++;
    }
    return out2;
  }

  /* 行内解析（含代码/链接保护、转义、强调、自动链接） */
  function inline(src, opts) {
    opts = opts || {};
    var ph = opts._ph || []; /* 嵌套调用（链接文字 / 隐藏内容）与外层共用同一份占位符 */
    var s = String(src);
    var push = function (htmlStr) { ph.push(htmlStr); return '\u0000' + (ph.length - 1) + '\u0000'; };

    /* 1. 尖括号自动链接（在转义之前识别） */
    s = s.replace(/<(https?:\/\/[^>\s]+|mailto:[^>\s]+|[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+)>/g, function (m, u) {
      var href;
      if (/^https?:/i.test(u)) href = u;
      else href = u.indexOf('mailto:') === 0 ? u : 'mailto:' + u;
      return push('<a href="' + esc(safeUrl(href)) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a>');
    });

    /* 2. HTML 转义 */
    if (!opts.escaped) s = esc(s);

    /* 2.5 换行：行尾两个空格=硬换行；普通换行（软换行）同样保留为可见换行，
     *     否则多行文本会被 HTML 折叠成一行。硬换行先用哨兵占位，最后与软换行合并成同一个 <br> */
    s = s.replace(/ {2,}\n/g, '\u0000BR\u0000\n');
    s = s.replace(/\n/g, '<br>\n');
    s = s.replace(/\u0000BR\u0000/g, '');

    /* 3. 行内代码 */
    s = s.replace(/(`+)([^`\n]*?)\1/g, function (m, t, inner) {
      return push('<code>' + inner + '</code>');
    });

    /* 3.5 行内数学 $...$（保留原文，渲染后由 MathJax 处理；\$ 转义不触发） */
    s = s.replace(/(?<!\\)\$([^$\n]+?)\$(?!\$)/g, function (m, tex) {
      return push('<span class="math-inline">$' + tex + '$</span>');
    });

    /* 3.6 脚注引用 [^id] → 上标（编号在渲染后填充） */
    s = s.replace(/\[\^([^\]]+)\]/g, function (m, id) {
      return push('<sup class="footnote-ref" data-fn="' + esc(id) + '"><a href="#fn-' + esc(id) + '">[?]</a></sup>');
    });

    /* 3.7 隐藏内容 ||spoiler|| → 遮罩（Discord 同款，点击显示）。放在行内代码/公式之后，
     *     这样 `||x||`（代码里）与 $||x||$（公式里）不会被误判；\| 转义也不触发（反斜杠在第 4 步处理） */
    s = s.replace(/\|\|([\s\S]+?)\|\|/g, function (m, inner) {
      return push('<span class="spoiler" role="button" tabindex="0" title="点击显示隐藏内容">' +
        inline(inner, { noLinks: opts.noLinks, escaped: true, noRestore: true, _ph: ph }) + '</span>');
    });

    /* 4. 反斜杠转义（转义结果用占位符保护，不再参与后续解析，如 \* 显示为字面 *） */
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!|>~])/g, function (m, ch) {
      return push(esc(ch));
    });

    /* 5. 图片与链接（手工扫描：URL 支持成对括号，如 data URI / Wikipedia 链接） */
    s = scanLinks(s, push, opts, ph);

    /* 6. 裸链接自动识别 */
    if (!opts.noLinks) {
      s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:!?)\]"'*_])/g, function (m, pre, url) {
        return pre + push('<a href="' + esc(safeUrl(url)) + '" target="_blank" rel="noopener noreferrer">' + url + '</a>');
      });
    }

    /* 7. 强调 */
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
    s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\W_])_([^_\n]+?)_(?![\w_])/g, '$1<em>$2</em>');

    /* 8. 还原保护占位（可能嵌套，循环还原至无占位符；递归调用时保留，由最外层统一还原） */
    if (!opts.noRestore) {
      for (var guard = 0; guard < 50; guard++) {
        var next = s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return ph[+i] || ''; });
        if (next === s) break;
        s = next;
      }
    }
    return s;
  }

  function safeUrl(u, isImage) {
    u = String(u || '').trim();
    /* 根路径（/img/a.svg）在本地 file:// 下会指到磁盘根、GitHub Pages 子目录部署也会跑偏 → 一律相对本程序解析 */
    if (/^\/(?!\/)/.test(u)) u = u.replace(/^\/+/, '');
    /* 带协议头的只放行白名单（挡掉 javascript: / data:text/html 等），其余按相对路径处理 */
    if (/^[a-z][a-z0-9+.-]*:/i.test(u)) {
      if (/^(https?|mailto|ftp):/i.test(u)) return u;
      if (isImage && /^data:image\//i.test(u)) return u;
      return '#';
    }
    if (u.charAt(0) === '#') return u;
    return u || '#';
  }

  function highlight(code, lang) {
    var cfg = LANGS[lang.toLowerCase()] || LANGS.default;
    var keys = cfg.k ? cfg.k.split(/\s+/).filter(Boolean) : [];
    var re = new RegExp(
      '("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)' +
      (cfg.c ? '(' + cfg.c.source + ')' : '()') +
      (keys.length ? '(\\b(?:' + keys.join('|') + ')\\b)' : '()') +
      '(\\b\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?\\b)' +
      '(\\b[A-Za-z_][A-Za-z0-9_]*(?=\\())',
      'g'
    );
    return code.replace(re, function (m, str, com, kw, num, fn) {
      if (str) return '<span class="t-str">' + str + '</span>';
      if (com) return '<span class="t-com">' + com + '</span>';
      if (kw) return '<span class="t-kw">' + kw + '</span>';
      if (num) return '<span class="t-num">' + num + '</span>';
      if (fn) return '<span class="t-fn">' + fn + '</span>';
      return m;
    });
  }

  /* ---------- 块渲染 ---------- */
  function renderBlocks(tokens, opts) {
    opts = opts || {};
    var out = [];
    for (var i = 0; i < tokens.length; i++) out.push(renderBlock(tokens[i], opts));
    return out.join('\n');
  }

  /* 标题锚点：GitHub 风格 slug（去掉行内标记、空格转连字符、重名依次 -1/-2），
   * 让正文里的 [文字](#标题) 能跳转；每渲染一次文档重置一次计数 */
  var slugSeen = {};
  function slugifyHeading(text) {
    var t = String(text)
      .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/`([^`]*)`/g, '$1')
      .replace(/[*_~]/g, '')
      .trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s_-]+/gu, '')
      .replace(/\s+/g, '-')
      .replace(/^-+|-+$/g, '');
    if (!t) t = 'section';
    var n = slugSeen[t] || 0;
    slugSeen[t] = n + 1;
    return n ? t + '-' + n : t;
  }

  function renderBlock(t, opts) {
    switch (t.type) {
      case 'p':
        return opts.tight ? inline(t.text) : '<p>' + inline(t.text) + '</p>';
      case 'h':
        var lvl = Math.min(6, Math.max(1, t.level));
        return '<h' + lvl + ' id="' + esc(slugifyHeading(t.text)) + '">' + inline(t.text) + '</h' + lvl + '>';
      case 'hr':
        return '<hr>';
      case 'math':
        /* 块级数学：$$ 与内容同行（MathJax 不识别 $$ 后跟空白），保留原文 */
        return '<div class="math-block">$$' + t.tex.trim() + '$$</div>';
      case 'code': {
        if (t.lang.toLowerCase() === 'mermaid') {
          /* Mermaid 图：保留原文，渲染后由 mermaid 库接管；无库时 CSS 显示为代码块 */
          return '<div class="mermaid">' + esc(t.code) + '</div>';
        }
        var lang = /^[a-zA-Z0-9_+-]+$/.test(t.lang) ? t.lang.toLowerCase() : '';
        var code = t.code.replace(/\n+$/, '');
        return '<pre' + (lang ? ' data-lang="' + lang + '"' : '') + '><code>' + highlight(esc(code), lang) + '</code></pre>';
      }
      case 'quote':
        return '<blockquote>' + renderBlocks(parseBlocks(t.inner)) + '</blockquote>';
      case 'list':
        return renderList(t.region);
      case 'table': {
        var h = '<table><thead><tr>';
        for (var i = 0; i < t.header.length; i++) {
          var a = t.aligns[i];
          h += '<th' + (a ? ' style="text-align:' + a + '"' : '') + '>' + inline(t.header[i]) + '</th>';
        }
        h += '</tr></thead><tbody>';
        for (var r = 0; r < t.rows.length; r++) {
          h += '<tr>';
          for (var c = 0; c < t.header.length; c++) {
            var cell = t.rows[r][c] || '';
            var al = t.aligns[c];
            h += '<td' + (al ? ' style="text-align:' + al + '"' : '') + '>' + inline(cell) + '</td>';
          }
          h += '</tr>';
        }
        return h + '</tbody></table>';
      }
      default:
        return '';
    }
  }

  function renderList(region) {
    var parsed = parseListRegion(region);
    if (!parsed.items.length) return '';
    var first = parsed.items[0];
    var tag = first.ordered ? 'ol' : 'ul';
    var h = '<' + tag + (first.ordered ? ' start="' + first.startNum + '"' : '') + '>';
    for (var i = 0; i < parsed.items.length; i++) {
      var it = parsed.items[i];
      var lines = it.content.split('\n');
      var m = /^\[([ xX])\]\s*(.*)$/.exec(lines[0]);
      if (m) {
        var checked = /[xX]/.test(m[1]);
        var inner = renderBlocks(parseBlocks([m[2]].concat(lines.slice(1)).join('\n')), { tight: !parsed.loose });
        h += '<li class="task' + (checked ? ' done' : '') + '"><input type="checkbox"' + (checked ? ' checked' : '') + ' disabled><span>' + inner + '</span></li>';
      } else {
        var body = renderBlocks(parseBlocks(it.content), { tight: !parsed.loose });
        h += '<li>' + body + '</li>';
      }
    }
    return h + '</' + tag + '>';
  }

  function renderDoc(md) {
    slugSeen = {}; /* 标题锚点计数按文档重置（大标题/引用块里的标题共用一套去重） */
    /* 收集脚注定义 [^id]: 内容（支持后续缩进延续行），从正文移除 */
    var fnMap = {}, fnOrder = [];
    var body = String(md).replace(/^\[\^([^\]]+)\]:[ \t]*(.*)(?:\n[ \t]+.*)*$/gm, function (m, id, first) {
      if (!(id in fnMap)) {
        var lines = m.split('\n');
        fnMap[id] = [first].concat(lines.slice(1).map(function (l) { return l.replace(/^[ \t]+/, ''); })).join('\n');
        fnOrder.push(id);
      }
      return '';
    });
    var html = renderBlocks(parseBlocks(body), {});
    if (fnOrder.length) {
      html += '\n<section class="footnotes">\n<hr>\n<ol>\n' + fnOrder.map(function (id) {
        return '<li id="fn-' + esc(id) + '">' + inline(fnMap[id]) + '</li>';
      }).join('\n') + '\n</ol>\n</section>';
    }
    return html;
  }

  /* ================================================================
   * 二、应用状态与界面
   * ================================================================ */
  var state = { files: [], active: -1, uid: 0 };
  var reader = $('#reader'), empty = $('#empty'), errorCard = $('#errorCard');
  var mdBody = $('#mdBody'), docName = $('#docName'), docExt = $('#docExt'), docMeta = $('#docMeta');
  var sidebar = $('#sidebar'), fileList = $('#fileList'), sideCount = $('#sideCount');
  var dropOverlay = $('#dropOverlay'), dropCount = $('#dropCount'), toast = $('#toast');
  var brandTitle = $('#brandTitle'), btnClear = $('#btnClear');

  /* ---------- 工具函数 ---------- */
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }
  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    var p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function extOf(name) {
    var m = /\.([^.]+)$/.exec(name);
    return m ? m[1].toLowerCase() : '';
  }
  function statsOf(text) {
    var lines = text.split(/\r?\n/);
    var nonEmpty = lines.filter(function (l) { return l.trim(); }).length;
    var cjk = (text.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
    var latin = (text.match(/[A-Za-z0-9]+/g) || []).length;
    return { lines: lines.length, nonEmpty: nonEmpty, words: cjk + latin };
  }
  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
  }

  /* ---------- 文件解码（UTF-8 失败时回退 GB18030） ---------- */
  function decodeText(buf) {
    var u8 = new Uint8Array(buf);
    var s;
    try { s = new TextDecoder('utf-8').decode(u8); } catch (e) { s = ''; }
    if (s.indexOf('\u0000') >= 0) return null;
    var bad = (s.match(/\uFFFD/g) || []).length;
    if (bad > 0 && bad / Math.max(s.length, 1) > 0.005) {
      try {
        var gb = new TextDecoder('gb18030').decode(u8);
        if ((gb.match(/\uFFFD/g) || []).length < bad && gb.indexOf('\u0000') < 0) return gb;
      } catch (e2) {}
    }
    return s;
  }

  function readFile(file) {
    return new Promise(function (resolve) {
      if (typeof file.arrayBuffer === 'function') {
        file.arrayBuffer().then(resolve, function () { resolve(null); });
      } else {
        var fr = new FileReader();
        fr.onload = function () { resolve(fr.result); };
        fr.onerror = function () { resolve(null); };
        fr.readAsArrayBuffer(file);
      }
    });
  }

  /* 仅允许 Markdown 文件进入（拖拽与文件选择共用此规则） */
  var MD_EXT_RE = /\.(md|markdown|mdown|mkd)$/i;
  function isMarkdownFile(file) { return MD_EXT_RE.test(file && file.name ? file.name : ''); }

  var inFlight = {}; /* 防止同一文件在异步读取期间被重复导入 */
  function addFiles(fileListObj) {
    var list = Array.prototype.slice.call(fileListObj || []);
    var accepted = [], rejected = [];
    list.forEach(function (file) { (isMarkdownFile(file) ? accepted : rejected).push(file); });
    var added = 0, updated = 0, skipped = 0;
    var firstKey = ''; /* 本次导入的第一个文件：导入完成后自动切过去浏览 */
    var jobs = [];
    accepted.forEach(function (file) {
      /* 文件夹上传：webkitRelativePath 带相对路径（如 课程/第一章/a.md） */
      var rel = (file.webkitRelativePath || file.path || '').replace(/\\/g, '/');
      var key = (rel || file.name) + '|' + file.size;
      if (inFlight[key]) { skipped++; return; }
      if (!firstKey) firstKey = key;
      inFlight[key] = true;
      jobs.push(readFile(file).then(function (buf) {
        var text = buf === null ? null : decodeText(buf);
        var dup = null;
        for (var i = 0; i < state.files.length; i++) {
          if (state.files[i].key === key) { dup = state.files[i]; break; }
        }
        if (dup) {
          dup.text = text;
          dup.err = text === null ? '无法识别为文本文件' : null;
          dup.lastModified = file.lastModified;
          if (text !== null) dup.stats = statsOf(text);
          updated++;
        } else {
          state.files.push({
            id: ++state.uid,
            key: key,
            name: file.name || '未命名.md',
            path: rel || '',
            size: file.size || 0,
            lastModified: file.lastModified,
            text: text,
            err: text === null ? '无法识别为文本文件' : null,
            stats: text === null ? null : statsOf(text)
          });
          added++;
        }
      }).then(function () { delete inFlight[key]; }, function () { delete inFlight[key]; }));
    });
    Promise.all(jobs).then(function () {
      /* 导入后立刻切到新文件（拖入时正在看别的文档也要切）；找不到才回退到「首次导入」逻辑 */
      var idx = -1;
      if (firstKey) {
        for (var i = 0; i < state.files.length; i++) {
          if (state.files[i].key === firstKey) { idx = i; break; }
        }
      }
      if (idx >= 0) state.active = idx;
      else if (state.active < 0 && state.files.length) state.active = state.files.length - 1;
      renderSidebar();
      renderReader();
      var msg = '';
      if (added) msg = '已导入 ' + added + ' 份文件' + (updated ? '，更新 ' + updated + ' 份' : '');
      else if (updated) msg = '已更新 ' + updated + ' 份文件';
      if (rejected.length) msg = (msg ? msg + '；' : '') + '忽略 ' + rejected.length + ' 份非 Markdown 文件';
      if (!msg && skipped) msg = '已忽略 ' + skipped + ' 份重复拖入';
      if (!msg) msg = '未导入任何文件：仅支持 .md / .markdown / .mdown / .mkd';
      showToast(msg);
    });
  }

  function addTextFile(name, text, path) {
    var bytes = new TextEncoder().encode(text);
    state.files.push({
      id: ++state.uid, key: (path || name) + '|' + bytes.length, name: name, path: path || '',
      size: bytes.length, lastModified: 0,
      text: text, err: null, stats: statsOf(text)
    });
    state.active = state.files.length - 1;
    renderSidebar();
    renderReader();
  }

  function removeFile(idx) {
    state.files.splice(idx, 1);
    if (state.files.length === 0) state.active = -1;
    else if (state.active >= state.files.length) state.active = state.files.length - 1;
    renderSidebar();
    renderReader();
    showToast('已移除');
  }

  function clearAll() {
    state.files = [];
    state.active = -1;
    if (typeof isEditMode === 'function' && isEditMode()) {
      if (mdEditor) mdEditor.setValue('');
      updateEditorHeader(null);
    }
    renderSidebar();
    renderReader();
    document.title = '墨阅 · Markdown 预览';
  }

  /* ---------- 侧边栏渲染（树形：按原文件夹路径分支显示） ---------- */
  var treeOpen = {}; /* 记录文件夹展开状态（按路径） */
  function buildTree() {
    var root = { folders: {}, files: [] };
    state.files.forEach(function (f, idx) {
      var parts = f.path ? f.path.split('/') : [];
      var name = parts.pop() || f.name;
      var node = root;
      parts.forEach(function (p) {
        if (!node.folders[p]) node.folders[p] = { folders: {}, files: [] };
        node = node.folders[p];
      });
      node.files.push({ f: f, idx: idx, name: name, path: f.path });
    });
    return root;
  }

  function makeFileIcon(ext) {
    var cls = 'f-icon' + (ext === 'md' ? ' ext-md' : ext === 'txt' ? ' ext-txt' : ext === 'markdown' ? ' ext-markdown' : '');
    var div = document.createElement('div');
    div.className = cls;
    div.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
    return div;
  }

  function renderTreeNode(node, container) {
    Object.keys(node.folders).sort(function (a, b) { return a.localeCompare(b, 'zh'); }).forEach(function (folderName) {
      var child = node.folders[folderName];
      var count = countFiles(child);
      var li = document.createElement('li');
      li.className = 'tree-folder' + (treeOpen[folderName] !== false ? ' open' : '');

      var head = document.createElement('div');
      head.className = 'tree-folder-head';
      head.innerHTML =
        '<span class="tf-arrow"></span>' +
        '<svg class="tf-icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>' +
        '<span class="tf-name"></span>' +
        '<span class="tf-count">' + count + '</span>';
      head.querySelector('.tf-name').textContent = folderName;
      head.addEventListener('click', function (ev) {
        ev.stopPropagation();
        li.classList.toggle('open');
        treeOpen[folderName] = li.classList.contains('open');
      });

      var childUl = document.createElement('ul');
      childUl.className = 'tree-children';
      renderTreeNode(child, childUl);

      li.appendChild(head);
      li.appendChild(childUl);
      container.appendChild(li);
    });

    node.files.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); }).forEach(function (item) {
      var f = item.f, i = item.idx;
      var li = document.createElement('li');
      li.className = 'tree-file' + (i === state.active ? ' active' : '') + (f.err ? ' f-bad' : '');
      li.dataset.idx = i;

      var icon = makeFileIcon(extOf(f.name));

      var info = document.createElement('div');
      info.className = 'f-info';
      var nm = document.createElement('div');
      nm.className = 'f-name';
      nm.textContent = item.name;
      var mt = document.createElement('div');
      mt.className = 'f-meta';
      var meta = f.err ? '⚠ ' + f.err : (fmtSize(f.size) + ' · ' + (f.stats ? fmtNum(f.stats.nonEmpty) : 0) + ' 行');
      if (f.temp) meta = '临时文档 · ' + meta;
      else if (f.path) {
        var dir = f.path.slice(0, f.path.lastIndexOf('/'));
        if (dir) meta = dir + ' · ' + meta;
      }
      mt.textContent = meta;
      info.appendChild(nm);
      info.appendChild(mt);

      var del = document.createElement('button');
      del.className = 'f-del';
      del.title = '移除该文件';
      del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        removeFile(+li.dataset.idx);
      });

      li.appendChild(icon);
      li.appendChild(info);
      li.appendChild(del);
      li.addEventListener('click', function () {
        state.active = +li.dataset.idx;
        renderSidebar();
        renderReader();
      });
      container.appendChild(li);
    });
  }

  function countFiles(node) {
    var n = node.files.length;
    Object.keys(node.folders).forEach(function (k) { n += countFiles(node.folders[k]); });
    return n;
  }

  function renderSidebar() {
    sideCount.textContent = state.files.length + ' 份';
    fileList.innerHTML = '';
    if (!state.files.length) {
      var li = document.createElement('li');
      li.className = 'side-empty';
      li.textContent = '还没有文件\n把 Markdown 文件或整个文件夹拖进页面，就会出现在这里';
      li.style.whiteSpace = 'pre-line';

  /* ---------- 阅读器渲染 ---------- */
  var copyBtn = null;
  function renderReader() {
    var f = state.active >= 0 ? state.files[state.active] : null;
    empty.hidden = !!f;
    reader.hidden = !f || (f && f.err);
    errorCard.hidden = !(f && f.err);
    if (!f) {
      brandTitle.textContent = '';
      document.title = '墨阅解析';
      /* 没有文件时自动退出编辑模式，返回首页（清空 / 移除最后一个文件等场景） */
      if (typeof isEditMode === 'function' && isEditMode()) {

        btnEdit.classList.remove('active');
        editorPane.hidden = true;
        if (mdEditor) mdEditor.setValue('');
      }
      return;
    }
    brandTitle.textContent = f.name;
    document.title = f.name + ' · 墨阅';
    if (f.err) {
      $('#errTitle').textContent = '无法解析「' + f.name + '」';
      $('#errMsg').textContent = f.err + '。请确认文件为 UTF-8 / GBK 编码的文本（Markdown）文件。';
      return;
    }
    docName.textContent = f.name;
    docExt.textContent = extOf(f.name) || 'md';
    var st = f.stats || statsOf(f.text);
    docMeta.innerHTML =
      '<span>' + fmtSize(f.size) + '</span><i>·</i>' +
      '<span>' + fmtNum(st.lines) + ' 行</span><i>·</i>' +
      '<span>' + fmtNum(st.words) + ' 字</span><i>·</i>' +
      '<span>更新于 ' + fmtTime(f.lastModified) + '</span>' +
      '<span class="doc-actions">' +
      '<button class="btn-ghost-text" id="btnCopy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制 HTML</button>' +
      '</span>';

    mdBody.classList.remove('enter');

    mdBody.classList.add('enter');

    copyBtn.addEventListener('click', copyHtml);
    postRender();
    /* 编辑模式：切换文件时同步编辑区 */
    if (isEditMode()) {
      if (mdEditor) { mdEditor.setValue(f.text); mdEditor.setScrollTop(0); }

  /* ================================================================
   * 编辑模式：左编辑 · 右预览（相接处为中线），同步滚动，可保存

      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];

    return '#' + ca.map(function (v, i) { return hx(v * t + cb[i] * (1 - t)); }).join('');
  }

  /* Monaco 主题跟随 app 亮/暗色变量（切主题时重新定义，变量值才最新） */

    if (!window.monaco) return;

    var card = cssVarOf('--card', dark ? '#14141b' : '#ffffff');
    var text = cssVarOf('--text', dark ? '#dcdce4' : '#26262e');
    var text2 = cssVarOf('--text-2', dark ? '#9696a3' : '#64646f');
    var text3 = cssVarOf('--text-3', dark ? '#63637a' : '#9c9ca8');
    var accent = cssVarOf('--accent', dark ? '#818cf8' : '#5b5bd6');
    var border = cssVarOf('--border', dark ? 'rgba(255,255,255,0.08)' : 'rgba(20,20,40,0.09)');
    var panel = cssVarOf('--panel-strong', dark ? 'rgba(15,15,23,0.94)' : 'rgba(255,255,255,0.92)');
    var codeColor = mixHex(accent, text, 0.78); /* 行内代码色：与预览区 color-mix(accent 78%, text) 一致 */
    /* 划词填充：参考原版偏蓝（#6399D3 一族）；暗色=半透明钢蓝、亮色=淡紫蓝。
       注意：Monaco 0.56 的 defineTheme 颜色必须用 HEX（#RRGGBBAA），rgba() 会被解析成纯红 #ff0000！ */
    var selBlue = dark ? '#6399D373' : '#5B5BD63D';        /* 0.45 / 0.24 */
    var selInactive = dark ? '#6399D342' : '#5B5BD624';    /* 0.26 / 0.14 */
    var selSoft = dark ? '#6399D333' : '#5B5BD61A';        /* 0.20 / 0.10 */
    var borderHex = dark ? '#FFFFFF14' : '#14142817';      /* 0.08 / 0.09 */
    var panelHex = dark ? '#0F0F17F0' : '#FFFFFFEB';       /* 0.94 / 0.92 */

      base: dark ? 'vs-dark' : 'vs',
      inherit: true,
      /* markdown 词法色统一走 accent 蓝：亮色主题下不再出现默认主题的“标题蓝 + 链接/标签红”双色 */
      rules: [
        { token: 'keyword.md', foreground: accent },             /* 标题 / 列表符 / 分隔线 */
        { token: 'string.link.md', foreground: accent },         /* 链接文字与 URL */
        { token: 'tag.md', foreground: accent },                 /* <item_作息时间表> 等尖括号 */
        { token: 'attribute.name.html.md', foreground: accent },
        { token: 'comment.md', foreground: text2 },              /* 引用块：默认主题是绿色，改中性灰 */
        { token: 'variable.md', foreground: codeColor },         /* 行内代码 */

      ],

        'editor.background': card,
        'editor.foreground': text,
        'editorCursor.foreground': accent,
        'editor.selectionBackground': selBlue,
        'editor.inactiveSelectionBackground': selInactive,
        'editor.selectionHighlightBackground': selSoft,
        'editor.wordHighlightBackground': selSoft,
        'editor.wordHighlightStrongBackground': selSoft,
        'editor.findMatchBackground': dark ? '#C084FC52' : '#8B5CF633',
        'editor.findMatchHighlightBackground': selSoft,
        'editor.lineHighlightBackground': dark ? '#FFFFFF09' : '#1414280A',
        'editorWidget.background': panelHex,
        'editorWidget.border': borderHex,
        'input.background': card,
        'input.foreground': text,
        'input.border': borderHex,
        'editorSuggestWidget.background': panelHex,
        'editorSuggestWidget.border': borderHex,
        'editorSuggestWidget.selectedBackground': dark ? '#6366F140' : '#5B5BD626',
        'scrollbarSlider.background': dark ? '#FFFFFF21' : '#14142829',
        'scrollbarSlider.hoverBackground': dark ? '#FFFFFF38' : '#14142842',
        'scrollbarSlider.activeBackground': dark ? '#FFFFFF4D' : '#14142857',

  /* 惰性创建 Monaco 编辑器（首次进入编辑模式时）；wrappingIndent:'same' = 折行续行对齐行首缩进 */

    mdEditor = monaco.editor.create(editorHost, {
      value: '',
      language: 'markdown',
      theme: 'md-theme',
      placeholder: '在此编辑 Markdown 源文本……',
      fontFamily: monoFont,
      fontSize: 13,
      lineHeight: 23,
      fontLigatures: false,
      minimap: { enabled: false },
      lineNumbers: 'off',
      glyphMargin: false,
      folding: false,
      wordWrap: 'on',
      wrappingIndent: 'same',
      scrollBeyondLastLine: false,
      scrollbar: { verticalScrollbarSize: 10, horizontalScrollbarSize: 10, horizontal: 'hidden', useShadows: false },
      overviewRulerBorder: false,
      overviewRulerLanes: 0,
      hideCursorInOverviewRuler: true,
      renderLineHighlight: 'none',

      pasteAs: { enabled: false },

      insertSpaces: true,

    mdEditor.onDidChangeModelContent(scheduleEditRender);
    mdEditor.onDidScrollChange(function (e) {
      if (e.scrollTop !== lastEdScrollTop) { lastEdScrollTop = e.scrollTop; syncScroll('edit'); }
      if (window.__updateSelHandles) window.__updateSelHandles(); /* 触屏选择手柄跟随滚动 */
    });

  }

  /* 清除模型上的全部诊断标记（防红波浪线） */

  }

  function updateEditorHeader(f) {
    $('#editorFileName').textContent = f ? (f.path || f.name) : '';
    $('#editorStats').textContent = f && f.stats ? (fmtNum(f.stats.lines) + ' 行 · ' + fmtNum(f.stats.words) + ' 字') : '';
  }

  /* 进出编辑模式时保持阅读进度：滚动容器会从「整页」换成「#reader 内部」，按当前视口顶部的内容块续读 */
  var READ_TOP_PAD = 104; /* 顶栏高度 + 一点呼吸空间 */
  function topVisibleBlock() {
    var nodes = mdBody.children;
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.height > 0 && r.bottom > READ_TOP_PAD) return nodes[i];
    }
    return mdBody.firstElementChild;
  }
  /* 整页滚动默认是平滑的（html{scroll-behavior:smooth}），换模式要瞬移，否则会「滑」一大段 */
  function setPageScroll(y) {

    window.scrollTo(0, Math.max(0, y));

  function toggleEdit() {
    /* 未打开任何文件时：直接新建一个临时文档并进入编辑 */
    if (!currentFile()) { createNewDoc(); return; }
    var on = !isEditMode();
    /* 先记住「正在读哪里」：已在顶部就不用管，直接走原来的回顶逻辑 */
    var atTop = on ? (window.scrollY || document.documentElement.scrollTop || 0) < 2 : reader.scrollTop < 2;
    var anchor = atTop ? null : topVisibleBlock();

    btnEdit.classList.toggle('active', on);
    editorPane.hidden = !on;
    if (on) {
      var f = currentFile();
      var ed = ensureEditor();
      if (ed) {
        ed.setValue(f ? f.text : '');

        ed.setScrollTop(0);
        ed.focus();
      }

      requestAnimationFrame(function () {
        if (mdEditor) mdEditor.layout();

          /* 让锚点块落回阅读区顶部，再把编辑器按比例对齐到同一位置 */

      mdBody.innerHTML = renderDoc(f.text);
      postRender();
      updateEditorHeader(f);
      syncScroll('edit');
    }, 300);
  }

  /* 同步滚动：按滚动比例双向联动（防回环） */

        }
      } finally {

      }
    });
  }

  btnEdit.addEventListener('click', toggleEdit);

  /* ---------- 新建临时 Markdown 文档 ---------- */
  function createNewDoc() {
    var n = 1;
    while (state.files.some(function (f) { return f.temp && f.name === '未命名文档' + (n > 1 ? ' ' + n : '') + '.md'; })) n++;
    var name = '未命名文档' + (n > 1 ? ' ' + n : '') + '.md';
    var f = {
      id: ++state.uid,
      key: 'temp|' + Date.now() + '|' + n,
      name: name,
      path: '',
      temp: true,
      size: 0,
      lastModified: Date.now(),
      text: '',
      err: null,
      stats: { lines: 1, nonEmpty: 0, words: 0 }
    };
    state.files.push(f);
    state.active = state.files.length - 1;
    renderSidebar();
    renderReader();
    if (!isEditMode()) toggleEdit();

    if (ed) { ed.setValue(''); ed.focus(); }

  $('#btnNew').addEventListener('click', function (e) {
    e.stopPropagation();
    closeMoreMenu();
    createNewDoc();
  });
  $('#btnNewEmpty').addEventListener('click', createNewDoc);
  $('#emptyNewDoc').addEventListener('click', createNewDoc);

  /* ---------- 编辑区拖放：区内选中文本拖动 = Monaco 原生移动（虚线光标预览、单步撤销）；

   * 文件拖入 = 不拦截，冒泡给页面级导入 ---------- */

  editorHost.addEventListener('dragover', function (e) {
    if (mdDragHasFiles(e)) return; /* 文件：交给页面级导入（不 preventDefault / 不拦截） */

    e.stopPropagation();

    var pos = mdDropPos(e);
    if (pos) mdEditor.setPosition(pos); /* 光标实时显示插入位置 */
  });
  editorHost.addEventListener('drop', function (e) {
    if (mdDragHasFiles(e)) return; /* 文件：交给页面级导入 */

    try { ext = e.dataTransfer ? (e.dataTransfer.getData('text/plain') || '') : ''; } catch (err) {}
    if (!ext) return;

    mdEditor.setSelection(new monaco.Selection(endPos.lineNumber, endPos.column, endPos.lineNumber, endPos.column));

  });

  /* ---------- 触屏适配（手机/平板）：滑动不弹键盘、长按选词 + 拖动扩展选区、双选择手柄自定义框选 ---------- */
  function setupTouchEditor() {

      handles.end = document.createElement('div');

      h.start.style.top = a.top + 'px';
      h.end.style.left = b.left + 'px';
      h.end.style.top = b.top + 'px';
      h.start.classList.add('on');
      h.end.classList.add('on');

    function dragHandleTo(kind, cx, cy) {
      if (!mdEditor) return;
      var hit = mdEditor.getTargetAtClientPoint(cx, cy);

      if (!p) return;
      var sel = mdEditor.getSelection();
      if (!sel) return;
      var m = mdEditor.getModel();
      var line = Math.min(Math.max(1, p.lineNumber), m.getLineCount());
      var col = Math.min(p.column, m.getLineMaxColumn(line));
      if (kind === 'start') {
        mdEditor.setSelection(new monaco.Selection(line, col, sel.positionLineNumber, sel.positionColumn));
      } else {
        mdEditor.setSelection(new monaco.Selection(sel.selectionStartLineNumber, sel.selectionStartColumn, line, col));
      }
      updateSelHandles();
    }
    /* 供 ensureEditor 的选区/滚动监听调用（setupTouchEditor 与编辑区创建不在同一时刻） */
    window.__updateSelHandles = updateSelHandles;

    editorHost.addEventListener('touchstart', function (e) {
      var t = e.touches && e.touches[0];
      if (!t) return;

        var pos = hit && hit.position;
        if (!pos) return;
        var model = mdEditor.getModel();
        var word = model.getWordAtPosition(pos);
        if (word) {
          touchCtx.anchor = { line: pos.lineNumber, col: word.startColumn };
          mdEditor.setSelection(new monaco.Selection(pos.lineNumber, word.startColumn, pos.lineNumber, word.endColumn));
          /* 先强制显示手柄（防定位异常时看不到），再精确定位 */
          var hh = ensureHandles();
          hh.start.classList.add('on');
          hh.end.classList.add('on');
          updateSelHandles();
          try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) {}
        } else {
          mdEditor.setPosition(pos);
        }
      }, HOLD_MS);
    }, { passive: true, capture: true });

    editorHost.addEventListener('touchmove', function (e) {
      var t = e.touches && e.touches[0];

    var refs = Array.prototype.slice.call(mdBody.querySelectorAll('.footnote-ref'));

    /* 幂等：postRender 可能对同一份 DOM 执行多次，先清掉上一轮生成的返回链接 */
    Array.prototype.slice.call(mdBody.querySelectorAll('.footnote-back')).forEach(function (el) {
      if (el.parentNode) el.parentNode.removeChild(el);

    /* 1) 引用点：填充序号 + 唯一锚点 id（同一脚注被多次引用 → fnref-id / fnref-id-2 / …） */
    var seen = {}, byFn = {};
    refs.forEach(function (sup) {
      var id = sup.getAttribute('data-fn') || '';
      var idx = -1;
      for (var k = 0; k < lis.length; k++) {
        if (lis[k].id === 'fn-' + id) { idx = k; break; }
      }
      seen[id] = (seen[id] || 0) + 1;
      sup.id = 'fnref-' + id + (seen[id] > 1 ? '-' + seen[id] : '');
      var a = sup.querySelector('a');
      if (a) {
        a.setAttribute('href', '#fn-' + id);
        if (idx >= 0) {
          a.textContent = idx + 1;

      (byFn[id] = byFn[id] || []).push(sup);

    lis.forEach(function (li) {

            console.error('[MD解析] 目录读取失败:', entry && entry.name, err);

            if (entry && entry.isDirectory) dirEntries.push(entry);
          } catch (err) {
            console.error('[MD解析] webkitGetAsEntry 异常:', err);
          }
        }
      });
    }
    console.debug('[MD解析] drop 句柄数:', handles.length, '目录数:', dirEntries.length, '文件数:', e.dataTransfer.files ? e.dataTransfer.files.length : 0);

    /* 路径一：现代句柄 */
    if (useHandles && handles.length) {
      Promise.all(handles).then(function (resolved) {
        var valid = resolved.filter(Boolean);
        if (!valid.length) {
          /* 句柄全部失败：回退旧路径 */
          console.debug('[MD解析] 句柄不可用，回退旧 API');
          processDirEntries();
          return;
        }
        var collected = [];
        var jobs = valid.map(function (h) { return collectHandle(h, '', collected); });
        return Promise.all(jobs).then(function () {
          var md = collected.filter(isMarkdownFile);
          console.debug('[MD解析] 句柄收集完成，共', collected.length, '个文件');
          if (md.length) addFiles(md);
          else showToast('文件夹内没有 Markdown 文件');
        });
      });
      return;
    }

    processDirEntries();
  });

  /* ---------- 示例文档 ---------- */
  var SAMPLE_IMG = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' width='900' height='340'>" +

    "</linearGradient></defs>" +

    "<text x='450' y='162' font-size='46' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>墨阅 Markdown</text>" +

    "</svg>"
  );

  var SAMPLE_MD = [
    '# 墨阅解析',

    '> 拖入即可解析，无需联网，全部渲染在本地完成。多份文件可在右上角侧边栏中随时切换。',
    '',
    '## 功能清单',
    '',
    '- [x] 一次拖入多份 Markdown 文件',
    '- [x] 侧边栏切换文件、移除文件',
    '- [x] 亮色 / 暗色主题 · 衬线 / 黑体切换',
    '- [x] 代码语法高亮（JS / Python / Bash / SQL 等）',
    '- [ ] 导出 PDF（规划中）',
    '',
    '### 常用语法速查',
    '',
    '| 语法 | 写法 | 效果 |',
    '| :--- | :---: | ---: |',
    '| 加粗 | `**文字**` | **文字** |',
    '| 斜体 | `*文字*` | *文字* |',
    '| 删除线 | `~~文字~~` | ~~文字~~ |',
    '| 行内代码 | `` `code` `` | `code` |',
    '| 链接 | `[链接](https://example.com)` | [链接](https://example.com) |',
    '',
    '## 代码高亮',
    '',
    '```js',
    'const greet = (name) => {',
    '  // 打个招呼',
    '  return `你好，${name}！`;',
    '};',
    '',
    'greet("世界");',
    '```',
    '',
    '```python',
    'def fib(n):',
    '    if n <= 1:',
    '        return n',
    '    return fib(n - 1) + fib(n - 2)',
    '```',
    '',
    '```bash',
    'echo "解析完成" && wc -l *.md',
    '```',
    '',
    '## 排版与引用',
    '',
    '这是**加粗**、*斜体*、***粗斜体***、~~删除线~~和 `行内代码`。自动识别裸链接：https://example.com',
    '',
    '> 好的工具应当像空气一样存在。',
    '>',
    '> > 嵌套引用同样支持。',
    '',
    '---',
    '',
    '### 嵌套列表',
    '',
    '1. 一级条目',
    '   - 二级无序条目',
    '   - 另一条',
    '2. 一级条目',
    '   1. 二级有序条目',
    '   2. 继续',
    '3. 一级条目',
    '',
    '![示例横幅](' + SAMPLE_IMG + ')',
    '',
    '*—— 完 ——*'
  ].join('\n');

  $('#btnSample').addEventListener('click', function () {
    addTextFile('示例文档.md', SAMPLE_MD);
    showToast('已载入示例文档');
  });

  /* ---------- 初始化 ---------- */
  disarmClear(); /* 首次打开即渲染「清空」图标，避免按钮空白 */
  renderSidebar();
  renderReader();

  /* 编辑模式布局：手机竖屏 / 窄窗口 / 竖屏电脑窗口 → 上下堆叠（上预览·下编辑） */
  var stackedMQ = window.matchMedia('(max-width: 820px), (orientation: portrait)');
  function updateEditLayout() {
    document.body.classList.toggle('edit-stacked', stackedMQ.matches);
  }
  updateEditLayout();
  if (stackedMQ.addEventListener) stackedMQ.addEventListener('change', updateEditLayout);
  else if (stackedMQ.addListener) stackedMQ.addListener(updateEditLayout);

  /* MathJax / Mermaid 库为 defer 加载：就绪后补渲染当前文档 */
  window.addEventListener('load', function () {
    if (window.MathJax || window.mermaid) postRender();
  });

  /* 调试钩子（浏览器自动化 / 测试用） */
  window.__debug = {
    importText: addTextFile,
    editor: function () { return mdEditor; },
    list: function () { return state.files.map(function (f) { return f.name; }); },
    openSidebar: openSidebar,
    closeSidebar: closeSidebar,
    setTheme: setTheme,
    setFont: setFont,
    touch: function () { if (typeof setupTouchEditor === 'function') setupTouchEditor(); },
    stacked: function (on) { document.body.classList.toggle('edit-stacked', !!on); },
    active: function () { return state.active; },
    errors: function () { return window.__errs.slice(); }
  };
})();

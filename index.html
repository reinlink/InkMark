<script>
/* 首屏前先定主题，避免闪烁 */
(function () {
  try {
    var t = localStorage.getItem('md-theme');
    if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    var f = localStorage.getItem('md-font') || 'serif';
    document.documentElement.dataset.theme = t;
    document.documentElement.dataset.font = f;
  } catch (e) {}
})();
</script>
<!-- MathJax 配置：仅按需渲染（$…$ 行内 / $$…$$ 块级），不自动扫描全文档 -->
<script>
window.MathJax = {

      Eta: '\\mathrm{H}', Iota: '\\mathrm{I}', Kappa: '\\mathrm{K}', Mu: '\\mathrm{M}',

  },
  options: { enableMenu: false, ignoreHtmlClass: 'tex2jax_ignore' },
  startup: { typeset: false }
};
</script>

<style>
/* ============ 基础 & 主题变量 ============ */
:root {
  --font-ui: "Inter", -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  --font-content: Georgia, "Times New Roman", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --radius: 18px;
}
[data-font="sans"] {
  --font-content: var(--font-ui);
}
:root {
  /* 暗色（默认） */
  --bg: #0c0c11;
  --bg-a: rgba(99, 102, 241, 0.16);
  --bg-b: rgba(168, 85, 247, 0.12);
  --card: #14141b;
  --surface-1: rgba(255, 255, 255, 0.03);
  --surface-2: rgba(255, 255, 255, 0.055);
  --text: #dcdce4;
  --text-2: #9696a3;
  --text-3: #63637a;
  --text-strong: #f2f2f8;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --accent: #818cf8;
  --accent-2: #c084fc;
  --on-accent: #ffffff;
  --panel: rgba(18, 18, 26, 0.72);
  --panel-strong: rgba(15, 15, 23, 0.94);
  --code-bg: #0b0b11;
  --code-border: rgba(255, 255, 255, 0.07);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45), 0 14px 40px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 10px 32px rgba(0, 0, 0, 0.5), 0 32px 80px rgba(0, 0, 0, 0.45);
  --overlay: rgba(5, 5, 12, 0.55);
  /* 代码高亮配色（对齐「目标样式.png」） */
  --t-kw: #e0af80; --t-lit: #e8b2f3; --t-fn: #be9de2; --t-var: #7eb8e5;
  --t-str: #a0cc79; --t-num: #e3d27d; --t-com: #bf6b60; --t-tag: #82cacc; --t-attr: #e3d27d;
  --t-add: #a0cc79; --t-del: #bf6b60;
  --t-plain: #f9fafb;
  --hr-line: rgba(255, 255, 255, 0.34);
  --code-block-bg: #1b1b1c; --code-bar-bg: #2c2c2e; --code-block-border: rgba(255,255,255,0.06);
}
[data-theme="light"] {
  --bg: #f2f2f5;
  --bg-a: rgba(99, 102, 241, 0.13);
  --bg-b: rgba(168, 85, 247, 0.09);
  --card: #ffffff;
  --surface-1: rgba(20, 20, 40, 0.03);
  --surface-2: rgba(20, 20, 40, 0.05);
  --text: #26262e;
  --text-2: #64646f;
  --text-3: #9c9ca8;
  --text-strong: #131318;
  --border: rgba(20, 20, 40, 0.09);
  --border-strong: rgba(20, 20, 40, 0.17);
  --accent: #5b5bd6;
  --accent-2: #8b5cf6;
  --on-accent: #ffffff;
  --panel: rgba(255, 255, 255, 0.78);
  --panel-strong: rgba(255, 255, 255, 0.92);
  --code-bg: #181820;
  --code-border: rgba(255, 255, 255, 0.08);
  --shadow-sm: 0 1px 2px rgba(20, 20, 40, 0.05), 0 4px 14px rgba(20, 20, 40, 0.06);
  --shadow-md: 0 6px 20px rgba(20, 20, 40, 0.08), 0 14px 40px rgba(20, 20, 40, 0.09);
  --shadow-lg: 0 10px 32px rgba(20, 20, 40, 0.10), 0 32px 80px rgba(20, 20, 40, 0.12);
  --overlay: rgba(10, 10, 24, 0.45);
  /* 代码高亮配色（亮色下用同色系的深色版） */
  --t-kw: #a15c00; --t-lit: #9b2fa8; --t-fn: #6d3fc4; --t-var: #1668b3;
  --t-str: #3d7a1f; --t-num: #8a6400; --t-com: #a8463a; --t-tag: #0b7285; --t-attr: #8a6400;
  --t-add: #3d7a1f; --t-del: #a8463a;
  --t-plain: #24242c;
  --hr-line: rgba(20, 20, 40, 0.30);
  --code-block-bg: #f7f7f9; --code-bar-bg: #ececf0; --code-block-border: rgba(20,20,40,0.10);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
/* 主题切换过渡：只在切换瞬间由 JS 给 <html> 加 .theme-anim（常驻会拖慢滚动与交互）。
 * 这是「老路子」= 给每个元素挂 transition，元素一多就掉帧；新版浏览器走 View Transition（见 setTheme）。
 * 即便如此，也把最重的两棵子树排除掉：代码块里的 token span 动辄上千个、mermaid 是整张 SVG，
 * 让它们直接换色，别参与逐元素过渡。 */
@media (prefers-reduced-motion: no-preference) {
  html.theme-anim,
  html.theme-anim *,
  html.theme-anim *::before,
  html.theme-anim *::after {
    transition: background-color .34s ease, color .34s ease, border-color .34s ease,
                fill .34s ease, stroke .34s ease, box-shadow .34s ease !important;
    transition-delay: 0s !important;
  }
  html.theme-anim .code-block *,
  html.theme-anim .mermaid *,
  html.theme-anim pre * {
    transition: none !important;
  }
}
/* View Transition 路子的淡入淡出时长（默认 250ms，这里跟老路子的 .34s 对齐） */
::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: .34s;
  animation-timing-function: ease;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 背景光晕 ============ */
.bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-blobs i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .8; }
.bg-blobs i:nth-child(1) { width: 560px; height: 560px; left: -160px; top: -180px; background: var(--bg-a); animation: drift 26s ease-in-out infinite alternate; }
.bg-blobs i:nth-child(2) { width: 640px; height: 640px; right: -220px; bottom: -240px; background: var(--bg-b); animation: drift 32s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 40px) scale(1.12); } }

/* ============ 顶栏 ============ */
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 70;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 18px 20px; pointer-events: none; gap: 12px;
}
.topbar > * { pointer-events: auto; }
.brand {
  display: flex; align-items: center; gap: 10px; max-width: 46vw;
  background: var(--panel); backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 16px 6px 6px; box-shadow: var(--shadow-sm);
  font-size: 14px; font-weight: 650; color: var(--text-strong);
}
.logo-mark {
  width: 30px; height: 30px; flex: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: var(--on-accent);
  font-size: 15px; font-weight: 800; letter-spacing: 0;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent);
}
.brand-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); font-weight: 500; font-size: 13px; }
.toolbar {
  display: flex; align-items: center; gap: 4px;
  background: var(--panel); backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px; box-shadow: var(--shadow-md);
}
.tool-btn {
  position: relative;
  width: 34px; height: 34px; border: 0; border-radius: 999px;
  background: transparent; color: var(--text-2);
  display: grid; place-items: center; cursor: pointer;
  transition: background .18s, color .18s, transform .12s;
}
.tool-btn:hover { background: var(--surface-2); color: var(--text-strong); }
.tool-btn:active { transform: scale(.92); }
.tool-btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tool-btn .badge {
  position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--on-accent); font-size: 10.5px; font-weight: 700; line-height: 17px; text-align: center;
  box-shadow: 0 0 0 2px var(--bg);
}
.tool-btn#btnSidebar.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
.tool-btn#btnEdit.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
.tool-btn#btnMore.active { background: var(--surface-2); color: var(--text-strong); }

/* ===== 「更多」面板：从更多按钮处向左展开 ===== */
.more-wrap { position: relative; display: flex; }
.more-menu {
  position: absolute; right: 0; top: calc(100% + 10px);
  min-width: 200px; padding: 6px;
  background: var(--panel-strong);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; gap: 2px;
  z-index: 90;
  animation: menuIn .16s cubic-bezier(.22, .9, .24, 1) both;
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
.more-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; border: 0; background: transparent; color: var(--text-2);
  font-family: var(--font-ui); font-size: 13px; font-weight: 550;
  padding: 9px 12px; border-radius: 9px; cursor: pointer; text-align: left;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.more-item:hover { background: var(--surface-2); color: var(--text-strong); }
.more-item .mi-icon { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
.more-item .mi-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.more-item.danger { color: #ef4444; }
.more-item.danger:hover { background: color-mix(in srgb, #ef4444 14%, transparent); color: #ef4444; }
.more-item.arm .mi-text { color: #ef4444; font-weight: 700; }
.more-sep { height: 1px; background: var(--border); margin: 5px 8px; }
.tool-btn#btnFont { font-size: 13px; font-weight: 700; font-family: var(--font-content, var(--font-ui)); letter-spacing: -.5px; }
.tool-sep { width: 1px; height: 18px; background: var(--border-strong); margin: 0 4px; }
.btn-ghost-text {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-2); border-radius: 999px; padding: 6px 13px;
  font-family: var(--font-ui); font-size: 12.5px; font-weight: 550; cursor: pointer;
  transition: all .18s;
}
.btn-ghost-text:hover { color: var(--text-strong); background: var(--surface-2); border-color: var(--border-strong); }
.btn-ghost-text svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ============ 主体：窄体竖状阅读栏 ============ */
main {
  position: relative; z-index: 1;
  padding: 96px 20px 64px;
  display: flex; flex-direction: column; align-items: center;
}
.card {
  width: 100%;
  max-width: min(920px, 94vw, calc(100vh * 0.62));
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: clamp(26px, 5vw, 60px) clamp(22px, 6vw, 68px);
}

/* ===== 编辑模式：左编辑 · 右预览（两栏等宽带状，整体居中，相接处为中线） ===== */
body.edit-mode main {
  flex-direction: row; align-items: stretch; justify-content: center;
  padding: 96px 0 0; gap: 0; height: 100vh; box-sizing: border-box;
}
body.edit-mode main > .card { border-radius: 0; box-shadow: none; }
#editorPane {
  display: flex; flex-direction: column;
  flex: 0 0 auto;
  width: min(920px, 94vw, calc(100vh * 0.62)); /* 与阅读栏同宽 */
  height: 100%;
  background: var(--card);
  border-right: 1px solid var(--border-strong); /* 中线 */
  box-shadow: var(--shadow-md);
  min-width: 0;
}
.editor-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  flex: none;
}
.editor-bar > svg { width: 15px; height: 15px; stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.editor-file-name {
  font-family: var(--font-ui); font-size: 13px; font-weight: 650;
  color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.editor-stats { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.editor-bar .btn-ghost-text { margin-left: auto; }
#editorHost {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  background: var(--card);
}
/* Monaco 的折行缩进由 wrappingIndent: same 提供（续行对齐逻辑行首缩进，Notepad3 式） */
#editorHost .monaco-editor { padding: 0; }
/* 滚动条与预览区同款：10px 宽、圆角、同色（--border-strong） */
#editorHost .monaco-scrollable-element > .scrollbar.vertical { width: 10px !important; }
#editorHost .monaco-scrollable-element > .scrollbar > .slider {
  background: var(--border-strong) !important;
  border-radius: 8px;
}
#editorHost .monaco-scrollable-element > .scrollbar > .slider:hover,
#editorHost .monaco-scrollable-element > .scrollbar > .slider.active {
  background: var(--text-3) !important;
}
/* 拖放落点指示线（内部拖动 / 外部文本拖入的光标预览）用主题色 */
#editorHost .monaco-editor .dnd-target { border-right-color: var(--accent) !important; }
/* 触屏：Monaco 隐藏 textarea 不接收触摸（否则滑动/点按会被浏览器原生聚焦弹键盘） */
#editorHost .monaco-editor textarea { pointer-events: none; }
/* 触屏长按选择手柄（Android 风格选择滑块） */
.md-sel-handle {
  position: absolute; z-index: 120; display: none;
  width: 26px; height: 26px; margin: -13px 0 0 -13px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--on-accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent), 0 2px 10px rgba(0, 0, 0, 0.45);
  pointer-events: auto; touch-action: none;
}
.md-sel-handle.on { display: block; }
/* mermaid 图表可点击放大（信息多时看大字） */
.markdown-body .mermaid svg { cursor: zoom-in; }
/* mermaid 图表放大浮层 */
.md-zoom-overlay {
  position: fixed; inset: 0; z-index: 999; display: none;
  align-items: center; justify-content: flex-start;
  background: rgba(5, 5, 12, 0.82); backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 28px; overflow: auto; cursor: zoom-out;
}
.md-zoom-overlay.show { display: flex; flex-direction: column; }
.md-zoom-overlay .md-zoom-box { margin: auto; cursor: default; }
.md-zoom-overlay svg {
  display: block; max-width: calc(100vw - 56px); max-height: 88vh;
  /* 必须用不透明的主题底色：--surface-1 是 3% 透明色，叠在 82% 的暗色遮罩上会变暗，
     亮色主题里 mermaid 烘死的深色连线（#333）就糊在深底上看不清了。 */
  background: var(--card); border-radius: 12px; box-shadow: var(--shadow-lg);
}
.md-zoom-overlay .md-zoom-close {
  position: fixed; top: 14px; right: 14px; width: 38px; height: 38px;
  border-radius: 50%; border: 1px solid var(--border-strong);
  background: var(--panel-strong); color: var(--text);
  font-size: 22px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.md-zoom-overlay .md-zoom-close:hover { background: var(--surface-2); }
body.edit-mode #reader {
  flex: 0 0 auto;
  width: min(920px, 94vw, calc(100vh * 0.62)); /* 与编辑区同宽，相接处即页面中线 */
  max-width: none;
  height: 100%;
  overflow-y: auto; padding: clamp(22px, 4vw, 44px) clamp(20px, 5vw, 52px);
  border-radius: 0; box-shadow: none; min-width: 0;
}

/* 编辑模式堆叠排布（手机竖屏 / 窄窗口 / 竖屏电脑窗口）：上预览 · 下编辑。
   由 JS 按 matchMedia('(max-width: 820px), (orientation: portrait)') 给 body 加 .edit-stacked */
body.edit-mode.edit-stacked main { flex-direction: column; padding: 84px 0 0; }
body.edit-mode.edit-stacked #reader { order: 1; width: 100%; height: 50%; max-width: none; border-bottom: 1px solid var(--border-strong); }
body.edit-mode.edit-stacked #editorPane { order: 2; width: 100%; height: 50%; border-right: 0; box-shadow: none; }

/* 空状态 */
#empty { min-height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.empty-icon {
  width: 88px; height: 88px; border-radius: 26px; margin-bottom: 10px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent-2) 14%, transparent));
  border: 1px solid var(--border);
  display: grid; place-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  cursor: pointer;
  transition: transform .2s cubic-bezier(.22, .9, .24, 1), box-shadow .2s, border-color .2s;
}
.empty-icon:hover { transform: translateY(-3px) scale(1.03); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 22%, transparent); }
.empty-icon:active { transform: scale(.97); }
.empty-icon svg { width: 40px; height: 40px; stroke: var(--accent); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#empty h1 { margin: 6px 0 0; font-size: 22px; font-weight: 750; letter-spacing: -0.01em; color: var(--text-strong); font-family: var(--font-ui); }
#empty p { margin: 4px 0 20px; font-size: 13.5px; color: var(--text-2); }
.empty-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn-primary {
  border: 0; cursor: pointer; border-radius: 999px; padding: 10px 22px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--on-accent); font-family: var(--font-ui); font-size: 13.5px; font-weight: 650;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 38%, transparent);
  transition: transform .15s, box-shadow .2s, filter .2s;
}
.btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 48%, transparent); }
.btn-primary:active { transform: scale(.97); }
.btn-ghost {
  border: 1px solid var(--border); cursor: pointer; border-radius: 999px; padding: 10px 22px;
  background: var(--surface-1); color: var(--text-2);
  font-family: var(--font-ui); font-size: 13.5px; font-weight: 600;
  transition: all .18s;
}
.btn-ghost:hover { color: var(--text-strong); border-color: var(--border-strong); background: var(--surface-2); }

/* 错误卡片 */
#errorCard { text-align: center; padding-top: 64px; padding-bottom: 64px; }
.err-icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center; background: color-mix(in srgb, #ef4444 14%, transparent); border: 1px solid color-mix(in srgb, #ef4444 30%, transparent); }
.err-icon svg { width: 32px; height: 32px; stroke: #ef4444; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#errorCard h2 { margin: 0 0 8px; font-size: 18px; color: var(--text-strong); }
#errorCard p { margin: 0; font-size: 13.5px; color: var(--text-2); }

/* 文档头部 */
.doc-head { margin-bottom: 6px; }
.doc-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.doc-name { font-family: var(--font-ui); font-size: clamp(20px, 3.2vw, 27px); font-weight: 760; letter-spacing: -0.015em; line-height: 1.3; color: var(--text-strong); word-break: break-all; }
.ext-chip {
  flex: none; font-family: var(--font-ui); font-size: 11px; font-weight: 750; letter-spacing: .07em;
  padding: 3px 9px; border-radius: 999px; text-transform: lowercase;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}
.doc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--text-2); }
.doc-meta i { font-style: normal; color: var(--text-3); }
.doc-actions { margin-left: auto; display: flex; gap: 8px; }
.doc-divider { height: 1px; margin-top: 22px; background: linear-gradient(90deg, var(--border-strong), transparent 72%); }

/* ============ Markdown 渲染区 ============ */
.markdown-body {
  font-family: var(--font-content);
  font-size: 16px; line-height: 1.9; color: var(--text);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.markdown-body.enter { animation: rise .5s cubic-bezier(.22, .9, .24, 1) both; }
.markdown-body > :first-child { margin-top: 0; }
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  font-family: var(--font-ui); font-weight: 720; letter-spacing: -0.012em;
  color: var(--text-strong); line-height: 1.4; margin: 1.7em 0 .65em;
}
.markdown-body h1 { font-size: 1.75em; padding-bottom: .45em; border-bottom: 1px solid var(--border); }
.markdown-body h2 { font-size: 1.42em; position: relative; padding-left: 15px; }
.markdown-body h2::before {
  content: ''; position: absolute; left: 0; top: .16em; bottom: .16em; width: 4px;
  border-radius: 4px; background: linear-gradient(180deg, var(--accent), var(--accent-2));
}
.markdown-body h3 { font-size: 1.18em; }
.markdown-body h4 { font-size: 1.03em; }
.markdown-body p { margin: .95em 0; }
.markdown-body a {
  color: var(--accent); text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  transition: border-color .15s;
}
.markdown-body a:hover { border-bottom-color: var(--accent); }
.markdown-body strong { color: var(--text-strong); font-weight: 700; }
.markdown-body del { color: var(--text-3); }
.markdown-body code {
  font-family: var(--font-mono); font-size: .86em;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: .14em .42em;
  color: color-mix(in srgb, var(--accent) 78%, var(--text));
  white-space: pre-wrap; word-break: break-word;
}
/* ===== 代码块：原版深色卡片外观 + 右上角语言角标（悬停/点击弹出复制·下载） =====
 * 说明：代码块亮暗主题都用深色底（沿用原版观感），所以 token 配色固定用深色那套，
 *       在 pre 上就地覆盖 --t-* 变量，避免亮色主题下变成"深底 + 深字"。 */
.markdown-body pre, .markdown-body .code-block {
  --t-kw: #e0af80; --t-lit: #e8b2f3; --t-fn: #be9de2; --t-var: #7eb8e5;
  --t-str: #a0cc79; --t-num: #e3d27d; --t-com: #bf6b60; --t-tag: #82cacc; --t-attr: #e3d27d;
  --t-add: #a0cc79; --t-del: #bf6b60; --t-plain: #f9fafb;
}
.markdown-body .code-block { position: relative; margin: 1.25em 0; }
.markdown-body .code-block > pre { margin: 0; }
.markdown-body pre {
  position: relative; padding: 1.05em 1.2em;
  background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: 13px; overflow: auto; line-height: 1.65;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03), var(--shadow-sm);
}
.markdown-body pre code {
  background: none; border: 0; padding: 0; color: var(--t-plain); font-size: .86em;
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; /* 长行软换行，不再需要横向滚动 */
}
/* 每个源码行是一个块（CSS 的 text-indent 只管块首行，所以必须由 highlight() 把每行包成 .cl）。
   软换行续行的缩进 = 该行自己的行首缩进：--i 是 splitCodeLines 数出来的源码行前导列数，
   行首缩 4 格续行就缩 4 格、行首不缩进续行也不缩（等价于编辑器 wrappingIndent:'same'）。 */
.markdown-body pre code > .cl {
  display: block;
  padding-left: calc(var(--i, 0) * 1ch);
  text-indent: calc(var(--i, 0) * -1ch);
}
.markdown-body pre code > .cl:empty::before { content: "\a0"; }
/* 普通模式：保持原样——不软换行（长行横向滚动）、不做续行缩进。
   给 ASCII 流程图 / 管线图这类「排版即内容」的块用（不带语言名或语言名为 text 的块默认走这里）。
   code 必须是 inline-block + min-width:100%：这样它会被最长行撑成一个真盒子，滚动区的右边界
   就能算上 pre 自己的 padding-right——否则溢出的是「行内文本」，右内边距被吞掉，
   滚到最右时长行会顶在卡片边框上（左侧却有 1.2em 空隙）。 */
.markdown-body .code-block[data-mode="plain"] pre code {
  display: inline-block; min-width: 100%; box-sizing: border-box;
  white-space: pre; overflow-wrap: normal; word-break: normal;
}
.markdown-body .code-block[data-mode="plain"] pre code > .cl {
  padding-left: 0; text-indent: 0;
}
/* 右上角工具区：语言角标（沿用原版角标样式）+ 悬停/点击弹出的按钮面板 */
/* 代码块右上角的悬浮工具区。
 * 注意层级：模式按钮必须放在 .code-tools 外面（.code-tools-bar 里），因为「复制 / 下载」面板
 * 是挂在 .code-tools:hover 上的——模式按钮若在 .code-tools 内，鼠标一移到它上面就会弹出面板。 */
.markdown-body .code-tools-bar {
  position: absolute; top: 8px; right: 12px; z-index: 3;
  display: flex; align-items: center; gap: 5px;
}
.markdown-body .code-tools {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-end;
}
/* 显示模式切换：普通模式（不换行、保持原样，给 ASCII 流程图/管线图用）/ 代码模式（自动换行 + 续行缩进） */
.markdown-body .code-mode {
  padding: 1px 7px; border-radius: 6px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.17); background: none;
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  line-height: 1.5; white-space: nowrap;
  color: rgba(255,255,255,.36);
  transition: color .15s, background .15s, border-color .15s;
}
.markdown-body .code-mode:hover { color: rgba(255,255,255,.88); background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.30); }
.markdown-body .code-block[data-mode="code"] .code-mode { color: rgba(255,255,255,.66); border-color: rgba(255,255,255,.28); }
.markdown-body .code-lang {
  padding: 2px 7px; border: 0; border-radius: 6px; background: none; cursor: pointer;
  font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; line-height: 1.5;
  color: rgba(255,255,255,.32);
  transition: color .15s, background .15s;
}
.markdown-body .code-lang:hover,
.markdown-body .code-tools.open .code-lang { color: rgba(255,255,255,.78); background: rgba(255,255,255,.08); }
.markdown-body .code-acts {
  position: absolute; top: calc(100% + 5px); right: 0;
  display: flex; align-items: center; gap: 2px; padding: 3px;
  background: var(--panel-strong); border: 1px solid var(--border-strong);
  border-radius: 10px; box-shadow: var(--shadow-md);
  opacity: 0; visibility: hidden; transform: translateY(-4px);
  transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
}
.markdown-body .code-tools:hover .code-acts,
.markdown-body .code-tools.open .code-acts { opacity: 1; visibility: visible; transform: none; }
.markdown-body .code-act {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  padding: 3px 8px; border: 0; border-radius: 7px; background: none; cursor: pointer;
  font-family: var(--font-ui); font-size: 11.5px; color: var(--text-2);
  transition: background .15s, color .15s;
}
.markdown-body .code-act svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.markdown-body .code-act:hover { background: var(--surface-2); color: var(--text-strong); }
.markdown-body .code-act.done { color: var(--t-str); }
/* 高亮 token 配色 */
.markdown-body pre .t-kw { color: var(--t-kw); }
.markdown-body pre .t-lit { color: var(--t-lit); }
.markdown-body pre .t-fn { color: var(--t-fn); }
.markdown-body pre .t-var { color: var(--t-var); }
.markdown-body pre .t-str { color: var(--t-str); }
.markdown-body pre .t-num { color: var(--t-num); }
.markdown-body pre .t-com { color: var(--t-com); font-style: italic; }
.markdown-body pre .t-tag { color: var(--t-tag); }
.markdown-body pre .t-attr { color: var(--t-attr); }
.markdown-body pre .t-add { color: var(--t-add); }
.markdown-body pre .t-del { color: var(--t-del); }
.markdown-body blockquote {
  margin: 1.25em 0; padding: .55em 1.25em .55em 1.15em;
  border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent);
  color: var(--text-2);
}
.markdown-body blockquote p { margin: .45em 0; }
.markdown-body blockquote blockquote { margin: .6em 0 .2em; }
.markdown-body ul, .markdown-body ol { margin: .95em 0; padding-left: 1.6em; }
.markdown-body li { margin: .32em 0; }
.markdown-body li::marker { color: var(--accent); font-weight: 600; }
.markdown-body li > ul, .markdown-body li > ol { margin: .25em 0; }
.markdown-body li.task { list-style: none; margin-left: -1.35em; display: flex; align-items: baseline; gap: .45em; }
.markdown-body li.task input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  width: 1.02em; height: 1.02em; margin: 0; flex: none;
  border: 1.5px solid var(--border-strong); border-radius: 4px;
  background: transparent; position: relative; top: .18em; cursor: default;
  transition: background .15s, border-color .15s;
}
.markdown-body li.task input[type="checkbox"]:checked {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
}
.markdown-body li.task input[type="checkbox"]:checked::after {
  content: ''; position: absolute; left: 3.4px; top: 1.2px;
  width: 4.6px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.markdown-body li.task.done > span { color: var(--text-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--text-3) 55%, transparent); }
.markdown-body table { border-collapse: collapse; width: 100%; margin: 1.25em 0; font-size: .92em; overflow: hidden; border-radius: 10px; }
.markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: .55em .8em; }
.markdown-body thead th { background: var(--surface-2); font-weight: 650; color: var(--text-strong); font-family: var(--font-ui); font-size: .95em; }
.markdown-body tbody tr:nth-child(even) td { background: var(--surface-1); }
.markdown-body img { display: block; max-width: 100%; height: auto; margin: 1.2em auto; border-radius: 12px; box-shadow: var(--shadow-sm); }
/* 独占一段 / 独占一个列表项的图（logo / 徽标）给个下限：不少 SVG 图标自带 width="1em"，按原尺寸只有 16px 太小 */
.markdown-body :is(p, li) > img:only-child,
.markdown-body :is(p, li) > a:only-child > img:only-child { min-width: min(3em, 100%); }
.markdown-body hr {
  border: 0; height: 1px; width: 62%; margin: 2.2em auto;
  /* 中间主色更实、两侧渐弱放缓（--hr-line 在主题里给亮色/暗色两套） */
  background: linear-gradient(90deg, transparent, var(--hr-line) 18%, var(--hr-line) 82%, transparent);
}
/* ===== 数学公式 ===== */
.markdown-body .math-inline { white-space: nowrap; }
.markdown-body .math-block {
  margin: 1.2em auto; text-align: center;
  padding: .4em 0; overflow-x: visible;
}
.markdown-body mjx-container { overflow-x: visible; }
/* 公式过宽时整体等比缩放到容器内（MathJax 的 SVG 带 viewBox，缩了不变形），不再出滚动条 */
.markdown-body .math-block mjx-container > svg { max-width: 100%; height: auto; }
/* ===== Mermaid 图 ===== */
.markdown-body .mermaid {
  margin: 1.2em 0; padding: 1em 1.2em;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 13px; text-align: center; overflow-x: auto;
  font-family: var(--font-mono); font-size: .85em; line-height: 1.5;
  white-space: pre; color: var(--text-2);
}
.markdown-body .mermaid svg { max-width: 100%; height: auto; margin: 0 auto; }
/* ===== 脚注 ===== */
.markdown-body .footnote-ref a {
  font-size: .72em; vertical-align: super; line-height: 0;
  color: var(--accent); text-decoration: none;
  border-bottom: 0; margin: 0 .1em;
}
.markdown-body .footnote-ref a:hover { text-decoration: underline; }
.markdown-body .footnotes {
  margin-top: 2.4em; font-size: .85em; color: var(--text-2);
}
.markdown-body .footnotes hr { width: 100%; margin: 0 0 1em; }
.markdown-body .footnotes ol { padding-left: 1.4em; margin: 0; }
.markdown-body .footnotes li { margin: .35em 0; }
.markdown-body .footnote-back {
  margin-left: .4em; color: var(--accent); text-decoration: none;
  border-bottom: 0; font-size: .95em; white-space: nowrap;
}
.markdown-body .footnote-back:hover { text-decoration: underline; }
/* 跳转落点高亮（脚注条目 / 正文引用上标 / 标题锚点）
 * 过渡必须写在「未高亮」的基础样式上，这样类名移除时才会淡出（写在 .fn-flash 里只会淡入）；
 * 圆角也必须写在基础样式上——只写在高亮态里的话，类名一移除圆角立刻消失，
 * 底色还在慢慢淡出，于是看到「圆角突然变直角」。外扩范围一律用 box-shadow 光圈，不用 padding，
 * 免得高亮时版面跳动。 */
.markdown-body .footnotes li,
.markdown-body .footnote-ref a,
.markdown-body :is(h1, h2, h3, h4, h5, h6) {
  transition: background-color .55s ease, box-shadow .55s ease, color .55s ease;
}
.markdown-body .footnotes li { border-radius: 6px; }
.markdown-body .footnote-ref a { border-radius: 4px; }
.markdown-body :is(h1, h2, h3, h4, h5, h6) { border-radius: 8px; }
.markdown-body .footnotes li:target,
.markdown-body .footnotes li.fn-flash {
  background: color-mix(in srgb, var(--accent) 32%, transparent);
  box-shadow: 0 0 0 .35em color-mix(in srgb, var(--accent) 32%, transparent);
}
.markdown-body .footnote-ref:target a,
.markdown-body .footnote-ref.fn-flash a {
  background: color-mix(in srgb, var(--accent) 42%, transparent);
  box-shadow: 0 0 0 .18em color-mix(in srgb, var(--accent) 42%, transparent);
}
/* 标题锚点落点：只画底色 + 外扩光圈，不加内边距，避免高亮时版面跳动 */
.markdown-body :is(h1, h2, h3, h4, h5, h6).fn-flash {
  background: color-mix(in srgb, var(--accent) 26%, transparent);
  box-shadow: 0 0 0 .4em color-mix(in srgb, var(--accent) 20%, transparent);
}

/* ===== 隐藏内容遮罩（||spoiler||，Discord 同款：黑条遮住，点击显示） ===== */
.markdown-body .spoiler {
  background: color-mix(in srgb, var(--text) 26%, transparent);
  color: transparent;
  border-radius: 5px; padding: 0 .22em;
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
  transition: background-color .16s ease, color .16s ease;
}
.markdown-body .spoiler:hover { background: color-mix(in srgb, var(--text) 34%, transparent); }
.markdown-body .spoiler:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 未显示时把里面**所有**元素一并压成透明：粗体、行内代码、链接等自带 color/背景，
   否则它们会从遮罩里透出来（现象：遮罩看着半透明，只有普通文字被遮住） */
.markdown-body .spoiler:not(.revealed) *,
.markdown-body .spoiler:not(.revealed) *::before,
.markdown-body .spoiler:not(.revealed) *::after {
  color: transparent !important;
  background: transparent !important;
  border-color: transparent !important;
  box-shadow: none !important;
  text-shadow: none !important;
  -webkit-text-fill-color: transparent !important;
}
/* 图片 / 矢量图没法用颜色遮，模糊掉 */
.markdown-body .spoiler:not(.revealed) img,
.markdown-body .spoiler:not(.revealed) svg { filter: blur(7px); }
.markdown-body .spoiler.revealed {
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  color: inherit; cursor: text;
  -webkit-user-select: auto; user-select: auto;
}

/* ============ 拖拽浮层 ============ */
#dropOverlay {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-items: center;
  background: var(--overlay); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  opacity: 0; visibility: hidden; transition: opacity .28s, visibility .28s;
  pointer-events: none;
}
#dropOverlay.show { opacity: 1; visibility: visible; }
.drop-inner {
  border: 2px dashed rgba(255,255,255,.38); border-radius: 30px;
  padding: 52px 76px; text-align: center; color: #fff;
  transform: scale(.96); transition: transform .28s cubic-bezier(.22,.9,.24,1);
}
#dropOverlay.show .drop-inner { transform: scale(1); }
.drop-inner svg { width: 52px; height: 52px; stroke: #fff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; animation: dropbounce 1.6s ease-in-out infinite; }
@keyframes dropbounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

<script>
'use strict';
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push(String(e.message)); });

(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  /* 属性值专用：在 esc 基础上把双引号也转义（URL / alt / title / id 里的引号不会截断属性） */
  var attrEsc = function (s) { return esc(s).replace(/"/g, '&quot;'); };
  var html = document.documentElement;

  /* ================================================================
   * 一、Markdown 解析器（纯本地，无依赖）
   * ================================================================ */
  var isBlank = function (l) { return /^\s*$/.test(l); };
  var isHr = function (l) { return /^ {0,3}([-_*])(?:[ \t]*\1){2,}[ \t]*$/.test(l); };
  var fenceRe = /^ {0,3}(```+|~~~+)\s*(\S*)\s*$/;
  var atxRe = /^ {0,3}(#{1,6})\s+(.+)$/;
  var quoteRe = /^ {0,3}>/;
  var listRe = /^(\s*)([*+-]|\d{1,9}[.)])(\s+)(.*)$/;
  var isList = function (l) { return listRe.test(l); };
  var isBlockStart = function (l) { return fenceRe.test(l) || isHr(l) || atxRe.test(l); };

  function parseBlocks(src) {
    var lines = String(src).replace(/^\uFEFF/, '').split(/\r\n|\r|\n/);
    var blocks = [], i = 0, n = lines.length;

    while (i < n) {
      var line = lines[i];
      if (isBlank(line)) { i++; continue; }

      /* 围栏代码块 */
      var fm = fenceRe.exec(line);
      if (fm) {
        var mk = fm[1][0], lang = fm[2], code = [];
        i++;
        while (i < n) {
          var cm = lines[i].match(/^ {0,3}(`+|~+)\s*$/);
          if (cm && cm[1][0] === mk && cm[1].length >= fm[1].length) { i++; break; }
          code.push(lines[i]); i++;
        }
        blocks.push({ type: 'code', lang: lang, code: code.join('\n') });
        continue;
      }

      /* 块级数学（$$...$$） */
      if (line.indexOf('$$') >= 0) {
        var mathInline = line.match(/^\$\$(.*?)\$\$\s*$/);
        if (mathInline && mathInline[1].trim()) {
          blocks.push({ type: 'math', tex: mathInline[1].trim() });
          i++; continue;
        }
        if (/^\$\$\s*$/.test(line)) {
          var tex = [];
          i++;
          while (i < n && !/^\$\$\s*$/.test(lines[i])) { tex.push(lines[i]); i++; }
          if (i < n) i++; /* 跳过闭合 $$ */
          var texJoined = tex.join('\n').trim();
          if (texJoined) blocks.push({ type: 'math', tex: texJoined });
          continue;
        }
      }

      if (isHr(line)) { blocks.push({ type: 'hr' }); i++; continue; }

      /* ATX 标题 */
      var am = atxRe.exec(line);
      if (am) {
        blocks.push({ type: 'h', level: am[1].length, text: am[2].replace(/\s*#+\s*$/, '') });
        i++; continue;
      }

      /* 引用块（递归解析内部） */
      if (quoteRe.test(line)) {
        var q = [];
        while (i < n && (quoteRe.test(lines[i]) || (isBlank(lines[i]) && i + 1 < n && quoteRe.test(lines[i + 1])))) {
          q.push(isBlank(lines[i]) ? '' : lines[i].replace(/^ {0,3}> ?/, ''));
          i++;
        }
        blocks.push({ type: 'quote', inner: q.join('\n') });
        continue;
      }

      /* 列表（整块收集后递归解析）
       * 一块只收同一种列表：有序 ↔ 无序在 CommonMark 里就是两个列表。
       * 若并成一块，有序项会被顺带渲染成无序（标签只取首项），且块内空行会把整块判为 loose，
       * 于是每项外面套一层 <p>（.markdown-body p 有 .95em 上下边距）——表现为行距突然变大 */
      if (isList(line)) {
        var itemIndent = line.match(/^\s*/)[0].length;
        var orderedList = /\d/.test(listRe.exec(line)[2]);
        var sameKind = function (l) {
          var mm = listRe.exec(l);
          return !!mm && /\d/.test(mm[2]) === orderedList;
        };
        var region = [];
        while (i < n) {
          var l = lines[i];
          if (isBlank(l)) {
            var j = i;
            while (j < n && isBlank(lines[j])) j++;
            if (j >= n) break;
            var indN = lines[j].match(/^\s*/)[0].length;
            /* 同级但换了列表类型 → 另一个列表，另起一块 */
            if (isList(lines[j]) && indN === itemIndent && !sameKind(lines[j])) break;
            if ((isList(lines[j]) && indN >= itemIndent) || (indN > itemIndent && !isBlockStart(lines[j]))) { region.push(l); i++; continue; }
            break;
          }
          var ind = l.match(/^\s*/)[0].length;
          if (isBlockStart(l)) break;
          /* 紧邻的同类项才属于本列表（缩进更深的子列表仍归入本块） */
          if (isList(l) && ind === itemIndent && !sameKind(l)) break;
          if (ind >= itemIndent) { region.push(l); i++; continue; }
          break;
        }
        blocks.push({ type: 'list', region: region.join('\n') });
        continue;
      }

      /* 缩进代码块（4 空格 / Tab） */
      if (line.indexOf('\t') === 0 || line.match(/^\s*/)[0].length >= 4) {
        var ic = [];
        while (i < n && (lines[i].indexOf('\t') === 0 || lines[i].match(/^\s*/)[0].length >= 4 || isBlank(lines[i]))) {
          ic.push(lines[i].replace(/^ {4}|\t/, ''));

      var rest = code.slice(i);
      var m;
      /* C / C++ 预处理指令与系统头文件名（别把 JSX 的 <Tag> 也当成头文件） */
      if (id === 'c' || id === 'cpp') {
        m = rest.match(/^#[ \t]*[A-Za-z_]\w*/);
        if (m) { out += hlSpan('kw', m[0]); i += m[0].length; continue; }
        m = rest.match(/^[ \t]*<[^>\n]*>/);
        if (m) {
          var lead = m[0].match(/^[ \t]*/)[0];
          out += esc(lead) + hlSpan('str', m[0].slice(lead.length));
          i += m[0].length; continue;
        }
      }
      /* JSX/TSX 标签 */
      if (id === 'jsx') {
        m = rest.match(/^<\/?[A-Za-z][\w.:-]*/);
        if (m) { out += hlSpan('tag', m[0]); i += m[0].length; continue; }
        m = rest.match(/^\/?>/);
        if (m) { out += hlSpan('tag', m[0]); i += m[0].length; continue; }
      }
      /* 注释 */
      if (cfg.c === 'hash') m = rest.match(/^#[^\n]*/);
      else if (cfg.c === 'sql') m = rest.match(/^--[^\n]*/) || rest.match(/^\/\*[\s\S]*?\*\//);
      else m = rest.match(/^\/\/[^\n]*/) || rest.match(/^\/\*[\s\S]*?\*\//);
      if (m) { out += hlSpan('com', m[0]); i += m[0].length; continue; }
      /* 字符串 */
      m = rest.match(/^("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|`(?:\\.|[^`\\])*`)/);
      if (m) { out += hlSpan('str', m[0]); i += m[0].length; continue; }
      /* shell 变量 */
      if (shell) {
        m = rest.match(/^\$\{[^}\n]*\}|^\$[A-Za-z_]\w*|^\$[0-9@*?#$!-]/);
        if (m) { out += hlSpan('var', m[0]); i += m[0].length; continue; }
      }
      /* 数字 */
      m = rest.match(/^\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?/);
      if (m) { out += hlSpan('num', m[0]); i += m[0].length; continue; }
      /* 标识符 */
      m = rest.match(/^[A-Za-z_$][\w$]*/);
      if (m) {
        var w = m[0], after = code.slice(i + w.length);
        var cls = '';
        if ((' ' + cfg.k + ' ').indexOf(' ' + w + ' ') >= 0) cls = 'kw';
        else if (/^\s*\(/.test(after)) cls = 'fn';                 /* 调用/定义（先于内置名，与目标样式一致） */
        else if ((' ' + (cfg.lit || '') + ' ').indexOf(' ' + w + ' ') >= 0) cls = 'lit';
        else if (inParams > 0) cls = 'var';
        else if (/^[A-Z]/.test(w)) cls = 'var';
        out += cls ? hlSpan(cls, w) : esc(w);
        i += w.length; continue;
      }
      /* 标点：只跟踪括号深度（括号内的标识符按变量/参数上蓝色） */
      var ch = code[i];
      if (ch === '(') inParams++;
      else if (ch === ')' && inParams > 0) inParams--;
      out += esc(ch);
      i++;
    }
    return out;
  }

  /* JSON：键蓝、字符串值绿、数字黄、true/false/null 粉 */
  function hlJson(code) {
    return code.replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|\b-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/g,
      function (m, str, colon, lit) {
        if (str) return hlSpan(colon ? 'var' : 'str', str) + (colon || '');
        if (lit) return hlSpan('lit', lit);
        return hlSpan('num', m);
      });
  }

  /* YAML / TOML / INI：键蓝、值绿/黄、注释暗红；[section] 在 toml 里是蓝、ini 里是蜜橙 */
  function hlKeyValue(code, id) {
    var ini = (id === 'ini');
    return hlLines(code, function (line) {
      var m = line.match(/^(\s*)([#;].*)$/);
      if (m) return esc(m[1]) + hlSpan('com', m[2]);
      m = line.match(/^(\s*)(\[[^\]\n]*\])(.*)$/);       /* toml/ini 的 section */
      if (m) return esc(m[1]) + hlSpan(ini ? 'kw' : 'var', m[2]) + esc(m[3]);
      m = line.match(/^(\s*)(-\s+)?([\w.$-]+)(\s*[:=]\s*)(.*)$/);
      if (m) {
        var tail = m[5], tt = tail.trim();
        var tv = /^(true|false|null|yes|no|on|off)$/i.test(tt) ? hlSpan('num', tail)
               : /^-?\d+(?:\.\d+)?$/.test(tt) ? hlSpan('num', tail)
               : (/^["'].*["']$/.test(tt) || ini) ? hlSpan('str', tail)
               : esc(tail);
        return esc(m[1] + (m[2] || '')) + hlSpan('var', m[3]) + esc(m[4]) + tv;
      }
      return esc(line);
    });
  }

  /* HTML / XML：标签青、属性名黄、属性值绿、注释暗红、文本原色 */
  function hlTags(code) {
    var out = '', i = 0, n = code.length, m;
    while (i < n) {
      var rest = code.slice(i);
      m = rest.match(/^<!--[\s\S]*?-->/);
      if (m) { out += hlSpan('com', m[0]); i += m[0].length; continue; }
      m = rest.match(/^<!\[CDATA\[[\s\S]*?\]\]>/);
      if (m) { out += hlSpan('com', m[0]); i += m[0].length; continue; }
      m = rest.match(/^<!\s*[A-Za-z][^>]*>/);      /* <!DOCTYPE …> 按标签上色 */
      if (m) { out += hlSpan('tag', m[0]); i += m[0].length; continue; }
      m = rest.match(/^<\/?[A-Za-z][\w:.-]*/);
      if (m) { out += hlSpan('tag', m[0]); i += m[0].length; continue; }
      m = rest.match(/^\/?>/);
      if (m) { out += hlSpan('tag', m[0]); i += m[0].length; continue; }
      m = rest.match(/^[A-Za-z_:][\w:.-]*(?=\s*=)/);
      if (m) { out += hlSpan('attr', m[0]); i += m[0].length; continue; }
      m = rest.match(/^"[^"]*"|^'[^']*'/);
      if (m) { out += hlSpan('str', m[0]); i += m[0].length; continue; }
      out += esc(code[i]); i++;
    }
    return out;
  }

  /* CSS：选择器蜜橙、属性蓝、数值黄、注释暗红、字符串绿 */
  function hlCss(code) {
    var out = '', i = 0, n = code.length, m;
    var inBlock = false;
    while (i < n) {
      var rest = code.slice(i);
      m = rest.match(/^\/\*[\s\S]*?\*\//);
      if (m) { out += hlSpan('com', m[0]); i += m[0].length; continue; }
      m = rest.match(/^"[^"\n]*"|^'[^'\n]*'/);
      if (m) { out += hlSpan('str', m[0]); i += m[0].length; continue; }
      if (!inBlock) {
        m = rest.match(/^[^{}\n;]+/);
        if (m) { out += hlSpan('kw', m[0]); i += m[0].length; continue; }
      } else {
        m = rest.match(/^[-\w]+(?=\s*:)/);
        if (m) { out += hlSpan('var', m[0]); i += m[0].length; continue; }
        m = rest.match(/^#[0-9a-fA-F]{3,8}\b/);
        if (m) { out += hlSpan('num', m[0]); i += m[0].length; continue; }
        m = rest.match(/^-?\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|fr|deg)?/);
        if (m) { out += hlSpan('num', m[0]); i += m[0].length; continue; }
        m = rest.match(/^[A-Za-z-]+(?=\s*[;,}\n]|\s*$)/);
        if (m) { out += hlSpan('lit', m[0]); i += m[0].length; continue; }
      }
      if (code[i] === '{') { inBlock = true; out += esc('{'); i++; continue; }
      if (code[i] === '}') { inBlock = false; out += esc('}'); i++; continue; }
      out += esc(code[i]); i++;
    }
    return out;
  }

  /* Markdown：标题暗红、列表符蜜橙、强调/代码/链接特殊处理 */
  function hlMarkdown(code) {
    return hlLines(code, function (line) {
      var m = line.match(/^(\s*)(#{1,6})(\s+)(.*)$/);
      if (m) return esc(m[1]) + hlSpan('com', m[2]) + esc(m[3]) + hlSpan('com', m[4]);
      m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(.*)$/);
      if (m) return esc(m[1]) + hlSpan('kw', m[2]) + esc(m[3]) + hlInlineMd(m[4]);
      m = line.match(/^(\s*>+)(\s*)(.*)$/);
      if (m) return hlSpan('com', m[1]) + esc(m[2]) + hlInlineMd(m[3]);
      return hlInlineMd(line);
    });
  }
  function hlInlineMd(s) {
    var out = '', i = 0;
    while (i < s.length) {
      var rest = s.slice(i), m;
      m = rest.match(/^`[^`\n]*`/);
      if (m) { out += hlSpan('str', m[0]); i += m[0].length; continue; }
      m = rest.match(/^\[[^\]\n]*\]\([^)\n]*\)/);
      if (m) {
        var parts = m[0].match(/^(\[[^\]\n]*\])(\([^)\n]*\))$/);
        out += hlSpan('var', parts[1]) + hlSpan('str', parts[2]);
        i += m[0].length; continue;
      }
      m = rest.match(/^\*\*[^*\n]+\*\*|^__[^_\n]+__/);
      if (m) { out += hlSpan('lit', m[0]); i += m[0].length; continue; }
      m = rest.match(/^\*[^*\n]+\*|^_[^_\n]+_/);
      if (m) { out += hlSpan('lit', m[0]); i += m[0].length; continue; }
      out += esc(s[i]); i++;
    }
    return out;
  }

  /* 把高亮后的 HTML 按行拆开、每行包一层 <span class="cl">。
   * 目的：软换行的续行要做悬挂缩进，而 CSS 的 text-indent 只作用于块的首行，必须逐行成块。
   * 拆行时把跨行的 <span> 在行尾闭合、下一行重新打开，保证标签配平。
   * 续行缩进跟着「这一行自己的行首缩进」走（--i = 前导空白占的列数），
   * 与编辑器 wrappingIndent:'same' 一致：行首缩 4 格续行就缩 4 格，行首顶格续行也顶格。 */
  function leadingCols(html) {
    var text = String(html).replace(/<[^>]*>/g, ''); /* 高亮会把行首空白裹进 <span>，所以先剥标签 */
    var col = 0;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (c === ' ') col++;
      else if (c === '\t') col += 8 - (col % 8); /* 跟着 CSS 默认 tab-size:8 的制表位走 */
      else break;
    }
    return col;
  }
  function splitCodeLines(html) {
    var out = [], cur = '', open = [], last = 0, m;
    var re = /<span\b[^>]*>|<\/span>|\n/g;
    var closeAll = function () { return open.length ? new Array(open.length + 1).join('</span>') : ''; };
    while ((m = re.exec(html))) {
      cur += html.slice(last, m.index);
      last = m.index + m[0].length;
      if (m[0] === '\n') {
        out.push(cur + closeAll());
        cur = open.join('');
      } else if (m[0] === '</span>') {
        open.pop();
        cur += '</span>';
      } else {
        open.push(m[0]);
        cur += m[0];
      }
    }
    cur += html.slice(last);
    out.push(cur + closeAll());
    return out.map(function (l) {
      var ind = leadingCols(l);
      return '<span class="cl"' + (ind ? ' style="--i:' + ind + '"' : '') + '>' + l + '</span>';
    }).join('');
  }

  function highlightRaw(code, lang) {
    var id = String(lang || '').toLowerCase();
    var cfg = LANGS[id] || LANGS.default;
    var text = String(code == null ? '' : code);
    if (id === 'diff') {
      return hlLines(text, function (line) {
        if (/^\+/.test(line)) return hlSpan('add', line);
        if (/^-/.test(line)) return hlSpan('del', line);
        if (/^@@/.test(line)) return hlSpan('kw', line);
        return esc(line);
      });
    }
    if (id === 'markdown') return hlMarkdown(text);
    if (id === 'html' || id === 'xml') return hlTags(text);
    if (id === 'css') return hlCss(text);
    if (id === 'json') return hlJson(text);
    if (id === 'yaml' || id === 'toml' || id === 'ini') return hlKeyValue(text, id);
    return hlGeneric(text, cfg, id);
  }

  function highlight(code, lang) { return splitCodeLines(highlightRaw(code, lang)); }

  /* ---------- 块渲染 ---------- */
  function renderBlocks(tokens, opts) {
    opts = opts || {};
    var out = [];
    for (var i = 0; i < tokens.length; i++) out.push(renderBlock(tokens[i], opts));
    return out.join('\n');
  }

  /* 标题锚点：GitHub 风格 slug（去掉行内标记、空格转连字符、重名依次 -1/-2），
   * 让正文里的 [文字](#标题) 能跳转；每渲染一次文档重置一次计数 */
  var slugSeen = {};
  function slugifyHeading(text) {
    var t = String(text)
      .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/`([^`]*)`/g, '$1')
      .replace(/[*_~]/g, '')
      .trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s_-]+/gu, '')
      .replace(/\s+/g, '-')
      .replace(/^-+|-+$/g, '');
    if (!t) t = 'section';
    var n = slugSeen[t] || 0;
    slugSeen[t] = n + 1;
    return n ? t + '-' + n : t;
  }

  function renderBlock(t, opts) {
    switch (t.type) {
      case 'p':
        return opts.tight ? inline(t.text) : '<p>' + inline(t.text) + '</p>';
      case 'h':
        var lvl = Math.min(6, Math.max(1, t.level));
        return '<h' + lvl + ' id="' + esc(slugifyHeading(t.text)) + '">' + inline(t.text) + '</h' + lvl + '>';
      case 'hr':
        return '<hr>';
      case 'math':
        /* 块级数学：$$ 与内容同行（MathJax 不识别 $$ 后跟空白），保留原文 */
        return '<div class="math-block">$$' + t.tex.trim() + '$$</div>';
      case 'code': {
        if (t.lang.toLowerCase() === 'mermaid') {
          /* Mermaid 图：保留原文，渲染后由 mermaid 库接管；无库时 CSS 显示为代码块。
             data-src 存原文，切换亮/暗主题时据此重绘（mermaid 主题是渲染时烘进 SVG 的） */
          return '<div class="mermaid" data-src="' + attrEsc(t.code) + '">' + esc(t.code) + '</div>';
        }
        var lang = /^[a-zA-Z0-9_+-]+$/.test(t.lang) ? t.lang.toLowerCase() : '';
        var code = t.code.replace(/\n+$/, '');
        /* 代码块 = 原版深色卡片 + 右上角「显示模式切换 + 语言角标」；角标悬停/点击才弹出「复制 / 下载」。
         * highlight 接收原始代码，内部自行转义。
         * 显示模式：不带语言名（或语言名为 text）默认「普通模式」= 不换行、保持原样；
         *           带了语言名默认「代码模式」= 自动换行 + 续行跟行首缩进。 */
        var mode = codeModeDefault(lang);
        return '<div class="code-block" data-mode="' + mode + '"' + (lang ? ' data-lang="' + attrEsc(lang) + '"' : '') + '>' +
          '<span class="code-tools-bar">' +
            codeModeButton(mode) +
            '<span class="code-tools">' +
              '<button type="button" class="code-lang" title="代码操作">' + esc(lang || 'text') + '</button>' +
              '<span class="code-acts">' +
                '<button type="button" class="code-act" data-act="copy" title="复制代码">' +
                  '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制</button>' +
                '<button type="button" class="code-act" data-act="download" title="下载代码">' +
                  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>下载</button>' +
              '</span>' +
            '</span>' +
          '</span>' +
          '<pre><code>' + highlight(code, lang) + '</code></pre>' +
        '</div>';
      }
      case 'quote':
        return '<blockquote>' + renderBlocks(parseBlocks(t.inner)) + '</blockquote>';
      case 'list':
        return renderList(t.region);
      case 'table': {
        var h = '<table><thead><tr>';
        for (var i = 0; i < t.header.length; i++) {
          var a = t.aligns[i];
          h += '<th' + (a ? ' style="text-align:' + a + '"' : '') + '>' + inline(t.header[i]) + '</th>';
        }
        h += '</tr></thead><tbody>';
        for (var r = 0; r < t.rows.length; r++) {
          h += '<tr>';
          for (var c = 0; c < t.header.length; c++) {
            var cell = t.rows[r][c] || '';
            var al = t.aligns[c];
            h += '<td' + (al ? ' style="text-align:' + al + '"' : '') + '>' + inline(cell) + '</td>';
          }
          h += '</tr>';
        }
        return h + '</tbody></table>';
      }
      default:
        return '';
    }
  }

  function renderList(region) {
    var parsed = parseListRegion(region);
    if (!parsed.items.length) return '';
    var first = parsed.items[0];
    var tag = first.ordered ? 'ol' : 'ul';
    var h = '<' + tag + (first.ordered ? ' start="' + first.startNum + '"' : '') + '>';
    for (var i = 0; i < parsed.items.length; i++) {
      var it = parsed.items[i];
      var lines = it.content.split('\n');
      var m = /^\[([ xX])\]\s*(.*)$/.exec(lines[0]);
      if (m) {
        var checked = /[xX]/.test(m[1]);
        var inner = renderBlocks(parseBlocks([m[2]].concat(lines.slice(1)).join('\n')), { tight: !parsed.loose });
        h += '<li class="task' + (checked ? ' done' : '') + '"><input type="checkbox"' + (checked ? ' checked' : '') + ' disabled><span>' + inner + '</span></li>';
      } else {
        var body = renderBlocks(parseBlocks(it.content), { tight: !parsed.loose });
        h += '<li>' + body + '</li>';
      }
    }
    return h + '</' + tag + '>';
  }

  function renderDoc(md) {
    slugSeen = {}; /* 标题锚点计数按文档重置（大标题/引用块里的标题共用一套去重） */
    /* 收集脚注定义 [^id]: 内容（顶格写，紧跟的缩进行并入同一条），并从正文移除。
     * ⚠️ 必须跳过围栏代码块内部：代码块里的 [^1]: 只是示例文本，不能被收走当脚注 */
    var fnMap = {}, fnOrder = [];
    var src = String(md).replace(/^\uFEFF/, '').split(/\r\n|\r|\n/);
    var body = [], fence = null;
    for (var li = 0; li < src.length; li++) {
      var line = src[li];
      if (fence) {
        var cf = /^ {0,3}(`+|~+)\s*$/.exec(line);
        if (cf && cf[1][0] === fence.ch && cf[1].length >= fence.len) fence = null;
        body.push(line);
        continue;
      }
      var of = fenceRe.exec(line);
      if (of) {
        fence = { ch: of[1][0], len: of[1].length };
        body.push(line);
        continue;
      }
      var dm = /^\[\^([^\]]+)\]:[ \t]*(.*)$/.exec(line);
      if (dm) {
        if (!(dm[1] in fnMap)) {
          var def = [dm[2]];
          var dj = li + 1;
          while (dj < src.length && /^[ \t]/.test(src[dj])) { def.push(src[dj].replace(/^[ \t]+/, '')); dj++; }
          fnMap[dm[1]] = def.join('\n');
          fnOrder.push(dm[1]);
          li = dj - 1;
        }
        body.push(''); /* 定义行留在原处一个空行，保证上下文的段落分隔不变 */
        continue;
      }
      body.push(line);
    }
    var html = renderBlocks(parseBlocks(body.join('\n')), {});
    if (fnOrder.length) {
      html += '\n<section class="footnotes">\n<hr>\n<ol>\n' + fnOrder.map(function (id) {
        return '<li id="fn-' + esc(id) + '">' + inline(fnMap[id]) + '</li>';
      }).join('\n') + '\n</ol>\n</section>';
    }
    return html;
  }

  /* ================================================================
   * 二、应用状态与界面
   * ================================================================ */
  var state = { files: [], active: -1, uid: 0 };
  var reader = $('#reader'), empty = $('#empty'), errorCard = $('#errorCard');
  var mdBody = $('#mdBody'), docName = $('#docName'), docExt = $('#docExt'), docMeta = $('#docMeta');
  var sidebar = $('#sidebar'), fileList = $('#fileList'), sideCount = $('#sideCount');
  var dropOverlay = $('#dropOverlay'), dropCount = $('#dropCount'), toast = $('#toast');
  var brandTitle = $('#brandTitle'), btnClear = $('#btnClear');

  /* ---------- 工具函数 ---------- */
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }
  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    var p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function extOf(name) {
    var m = /\.([^.]+)$/.exec(name);
    return m ? m[1].toLowerCase() : '';
  }
  function statsOf(text) {
    var lines = text.split(/\r?\n/);
    var nonEmpty = lines.filter(function (l) { return l.trim(); }).length;
    var cjk = (text.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
    var latin = (text.match(/[A-Za-z0-9]+/g) || []).length;

  var READ_TOP_PAD = 104; /* 顶栏高度 + 一点呼吸空间 */

    var inset = 0;

  function scheduleEditRender() {

  /* 同步滚动：按滚动比例双向联动（防回环） */

  /* ---------- 新建临时 Markdown 文档 ---------- */
  function createNewDoc() {
    var n = 1;
    while (state.files.some(function (f) { return f.temp && f.name === '未命名文档' + (n > 1 ? ' ' + n : '') + '.md'; })) n++;
    var name = '未命名文档' + (n > 1 ? ' ' + n : '') + '.md';
    var f = {
      id: ++state.uid,
      key: 'temp|' + Date.now() + '|' + n,
      name: name,
      path: '',
      temp: true,
      size: 0,
      lastModified: Date.now(),
      text: '',
      err: null,
      stats: { lines: 1, nonEmpty: 0, words: 0 }
    };
    state.files.push(f);
    state.active = state.files.length - 1;
    renderSidebar();
    renderReader();
    if (!isEditMode()) toggleEdit();

  $('#btnNew').addEventListener('click', function (e) {

  }

  editorHost.addEventListener('dragover', function (e) {
    if (mdDragHasFiles(e)) return; /* 文件：交给页面级导入（不 preventDefault / 不拦截） */

    e.stopPropagation();

    var pos = mdDropPos(e);
    if (pos) mdEditor.setPosition(pos); /* 光标实时显示插入位置 */
  });
  editorHost.addEventListener('drop', function (e) {
    if (mdDragHasFiles(e)) return; /* 文件：交给页面级导入 */

    try { ext = e.dataTransfer ? (e.dataTransfer.getData('text/plain') || '') : ''; } catch (err) {}
    if (!ext) return;
    e.preventDefault();
    e.stopPropagation();

    var pos = mdDropPos(e) || mdEditor.getPosition();
    var at = model.getOffsetAt(pos);
    /* 一次编辑 + pushUndoStop 包裹 = 一次 Ctrl+Z 整体撤销 */

    mdEditor.executeEdits('drop-insert', [{ range: mdRangeAt(at), text: ext }]);

  /* ---------- 触屏适配（手机/平板）：滑动不弹键盘、长按选词 + 拖动扩展选区、双选择手柄自定义框选 ---------- */
  function setupTouchEditor() {
    var touchCtx = { sx: 0, sy: 0, moved: false, holding: false, timer: null, anchor: null, handleDrag: null };
    var TOUCH_SLOP = 5, HOLD_MS = 600; /* 手指动过 5px 即视为滑动（微滑也拦截 tap，避免弹键盘） */
    var handles = null;

    function ensureHandles() {
      if (handles) return handles;
      handles = { start: null, end: null };
      handles.start = document.createElement('div');
      handles.start.className = 'md-sel-handle md-sel-handle-start';
      handles.end = document.createElement('div');
      handles.end.className = 'md-sel-handle md-sel-handle-end';
      editorHost.appendChild(handles.start);
      editorHost.appendChild(handles.end);
      bindHandleDrag('start', handles.start);
      bindHandleDrag('end', handles.end);

    function bindHandleDrag(kind, el) {

        e.preventDefault();

      }, { passive: false });
      el.addEventListener('touchend', function (e) {
        e.preventDefault();
        e.stopPropagation();
        touchCtx.handleDrag = null;
      }, { capture: true });
    }
    function handlePos(pos) {
      if (!pos || !mdEditor) return null;
      var c = mdEditor.getScrolledVisiblePosition(pos);
      if (!c && mdEditor.getTopForLineNumber) {
        /* 兜底：行顶坐标 + 按字符宽估算 */
        var top = mdEditor.getTopForLineNumber(pos.lineNumber);
        if (top == null) return null;
        c = { top: top, left: (pos.column - 1) * 8, height: 20 };
      }
      if (!c) return null;
      var base = editorHost.querySelector('.monaco-editor') || editorHost.querySelector('.view-lines');
      if (!base) return null;
      var hostRect = editorHost.getBoundingClientRect();
      var baseRect = base.getBoundingClientRect();
      return { left: c.left + baseRect.left - hostRect.left, top: c.top + baseRect.top - hostRect.top };
    }
    function updateSelHandles() {
      var sel = mdEditor && mdEditor.getSelection();
      if (!sel || sel.isEmpty()) {
        if (handles) {
          handles.start.classList.remove('on');
          handles.end.classList.remove('on');
        }
        return;
      }
      var h = ensureHandles();
      var a = handlePos({ lineNumber: sel.selectionStartLineNumber, column: sel.selectionStartColumn });
      var b = handlePos({ lineNumber: sel.positionLineNumber, column: sel.positionColumn });
      if (!a || !b) return;
      h.start.style.left = a.left + 'px';
      h.start.style.top = a.top + 'px';
      h.end.style.left = b.left + 'px';
      h.end.style.top = b.top + 'px';
      h.start.classList.add('on');
      h.end.classList.add('on');

      if (!sel) return;

      var col = Math.min(p.column, m.getLineMaxColumn(line));

      } else {

      }
      updateSelHandles();
    }
    /* 供 ensureEditor 的选区/滚动监听调用（setupTouchEditor 与编辑区创建不在同一时刻） */
    window.__updateSelHandles = updateSelHandles;

    editorHost.addEventListener('touchstart', function (e) {
      var t = e.touches && e.touches[0];
      if (!t) return;
      touchCtx.sx = t.clientX; touchCtx.sy = t.clientY;

      touchCtx.handleDrag = null;

      touchCtx.timer = setTimeout(function () {
        if (touchCtx.moved || touchCtx.handleDrag || !mdEditor) return;

        var pos = hit && hit.position;
        if (!pos) return;
        var model = mdEditor.getModel();
        var word = model.getWordAtPosition(pos);
        if (word) {
          touchCtx.anchor = { line: pos.lineNumber, col: word.startColumn };
          mdEditor.setSelection(new monaco.Selection(pos.lineNumber, word.startColumn, pos.lineNumber, word.endColumn));
          /* 先强制显示手柄（防定位异常时看不到），再精确定位 */
          var hh = ensureHandles();
          hh.start.classList.add('on');
          hh.end.classList.add('on');
          updateSelHandles();
          try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) {}

          mdEditor.setPosition(pos);
        }
      }, HOLD_MS);
    }, { passive: true, capture: true });

    editorHost.addEventListener('touchmove', function (e) {
      var t = e.touches && e.touches[0];
      if (!t) return;
      var dx = t.clientX - touchCtx.sx, dy = t.clientY - touchCtx.sy;
      if (!touchCtx.moved && (Math.abs(dx) > TOUCH_SLOP || Math.abs(dy) > TOUCH_SLOP)) {

        clearTimeout(touchCtx.timer);
      }
      if (touchCtx.holding && touchCtx.anchor && mdEditor) {
        var hit = mdEditor.getTargetAtClientPoint(t.clientX, t.clientY);
        var p = hit && hit.position;
        if (p) {
          var m = mdEditor.getModel();
          var line = Math.min(Math.max(1, p.lineNumber), m.getLineCount());
          var col = Math.min(p.column, m.getLineMaxColumn(line));
          if (line > touchCtx.anchor.line || (line === touchCtx.anchor.line && col >= touchCtx.anchor.col)) {
            mdEditor.setSelection(new monaco.Selection(touchCtx.anchor.line, touchCtx.anchor.col, line, col));
          } else {
            mdEditor.setSelection(new monaco.Selection(line, col, touchCtx.anchor.line, touchCtx.anchor.col));
          }
          updateSelHandles();
          if (e.cancelable) e.preventDefault(); /* 选词拖动时阻止页面滚动 */
        }

    }, { passive: false, capture: true });

    editorHost.addEventListener('touchend', function (e) {
      clearTimeout(touchCtx.timer);
      if (touchCtx.holding || touchCtx.moved) {
        /* 长按：拦截 Monaco 的 contextmenu 手势；滑动（哪怕微滑）：拦截 tap 聚焦（不弹键盘） */
        e.stopPropagation();
        if (e.cancelable) e.preventDefault();
      }
      touchCtx.holding = false;
    }, { capture: true });

    editorHost.addEventListener('touchcancel', function () {
      clearTimeout(touchCtx.timer);
      touchCtx.holding = false;
      touchCtx.handleDrag = null;
    }, { capture: true });

    editorHost.addEventListener('contextmenu', function (e) {
      if (touchCtx.holding) e.preventDefault();
    }, { capture: true });
  }

  /* 保存：优先 File System Access API 写回本地，否则下载导出 */
  function saveEdit() {
    var f = currentFile();
    if (!f) return;
    f.text = mdEditor ? mdEditor.getValue() : '';
    f.stats = statsOf(f.text);
    var blob = new Blob([f.text], { type: 'text/markdown;charset=utf-8' });
    if (window.showSaveFilePicker) {
      showSaveFilePicker({
        suggestedName: f.name,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkd'] } }]
      }).then(function (handle) {
        return handle.createWritable().then(function (w) { return w.write(blob).then(function () { return w.close(); }); });
      }).then(function () { showToast('已保存：' + f.name); }).catch(function (err) {
        if (!err || err.name !== 'AbortError') downloadEditFile(f, blob);
      });
    } else {
      downloadEditFile(f, blob);
    }
  }
  function downloadEditFile(f, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast('已下载：' + f.name);
  }
  $('#btnSaveEdit').addEventListener('click', saveEdit);

  /* ---------- 渲染后处理：脚注编号 / MathJax / Mermaid ---------- */

    var pre = document.createElement('pre');
    var code = document.createElement('code');
    code.textContent = el.textContent;
    pre.appendChild(code);
    el.replaceWith(pre);
  }

  /* Mermaid 图表点击放大（信息多的图放大看字） */
  var zoomOverlay = null, zoomLayerOn = false;
  function closeZoom() {

  function zoomMermaid(svg) {

      zoomOverlay.addEventListener('click', function (e) { if (e.target === zoomOverlay) closeZoom(); });
      document.body.appendChild(zoomOverlay);
    }
    var clone = svg.cloneNode(true);
    /* mermaid 会给 svg 内联 style="max-width:<图宽>px"，会压住放大，先清掉 */
    try { clone.style.removeProperty('max-width'); } catch (err) {}
    /* 按 viewBox 等比放大到视口内最大，保证小字也看得清 */
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (vb && vb.width > 0 && vb.height > 0) {

      var ratio = Math.min(maxW / vb.width, maxH / vb.height, 4);
      clone.setAttribute('width', Math.max(1, Math.round(vb.width * ratio)));
      clone.setAttribute('height', Math.max(1, Math.round(vb.height * ratio)));
    }
    var box = document.createElement('div');
    box.className = 'md-zoom-box';
    box.appendChild(clone);
    var btn = document.createElement('button');
    btn.className = 'md-zoom-close';
    btn.setAttribute('aria-label', '关闭');
    btn.innerHTML = '&times;';
    btn.addEventListener('click', closeZoom);
    zoomOverlay.replaceChildren(box, btn);
    zoomOverlay.classList.add('show');
    if (!zoomLayerOn) { zoomLayerOn = true; registerLayer(closeZoom); }  /* 返回键 / ESC 也能关掉 */
  }

    if (mdBody.dataset.zoomBound) return;
    mdBody.dataset.zoomBound = '1';
    mdBody.addEventListener('click', function (e) {
      var svg = e.target && e.target.closest ? e.target.closest('.mermaid svg') : null;
      if (!svg) return;
      e.stopPropagation();
      zoomMermaid(svg);
    });
